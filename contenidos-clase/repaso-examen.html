<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Repaso Arquitectura</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1d1d1b;--muted:#6b6a65;--line:#e3e1da;--accent:#2f5d8a;--accent-ink:#fff;--ok:#2e7d4f;--ok-bg:#e6f3ea;--bad:#b3392f;--bad-bg:#f8e7e5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141413;--card:#1e1e1c;--ink:#ecebe6;--muted:#9c9a93;--line:#33322e;--accent:#7fb0e0;--accent-ink:#0e1a26;--ok:#6cc890;--ok-bg:#183424;--bad:#ef8a80;--bad-bg:#3a1d1a}}
:root[data-theme="dark"]{--bg:#141413;--card:#1e1e1c;--ink:#ecebe6;--muted:#9c9a93;--line:#33322e;--accent:#7fb0e0;--accent-ink:#0e1a26;--ok:#6cc890;--ok-bg:#183424;--bad:#ef8a80;--bad-bg:#3a1d1a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:24px 16px 64px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
h1{font-size:1.5rem;margin:0}
h2{font-size:1.15rem;margin:0 0 10px}
.muted{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px;margin:12px 0}
.topics label{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border-radius:8px;border:1px solid var(--line);font-size:.92rem}
.topics input{margin-top:4px}
select,input[type=number]{font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:10px 12px}
.opt.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ink)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--ink)}
.q{white-space:pre-wrap;font-size:1.05rem;margin:6px 0 4px}
.tag{display:inline-block;font-size:.78rem;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.expl{margin-top:10px;padding:10px 12px;border-left:3px solid var(--accent);background:var(--bg);border-radius:0 8px 8px 0}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 0}
.bar>i{display:block;height:100%;background:var(--accent)}
.score{font-size:2.4rem;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:.92rem}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
ul.sum{margin:6px 0 0;padding-left:20px}
details summary{cursor:pointer;font-weight:600}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div><h1>Repaso de Arquitectura de Computadores</h1><div class="muted" id="stats"></div></div>
  <button id="theme" title="Cambiar tema">◐</button>
</header>

<div class="row tabs" style="margin-bottom:14px">
  <button data-tab="exam" aria-pressed="true">Examen</button>
  <button data-tab="study" aria-pressed="false">Conceptos clave</button>
</div>

<section id="setup" class="card">
  <h2>Configurar examen</h2>
  <div class="row"><button id="all">Todos</button><button id="none">Ninguno</button></div>
  <div class="topics" id="topicList"></div>
  <div class="row">
    <label>Preguntas: <select id="count"><option>10</option><option selected>20</option><option>40</option><option value="0">Todas</option></select></label>
    <label>Corrección: <select id="mode"><option value="now">Inmediata</option><option value="end">Al final</option></select></label>
    <button class="primary" id="start">Empezar</button>
  </div>
</section>

<section id="quiz" class="hide"></section>
<section id="result" class="hide"></section>
<section id="study" class="hide"></section>
</div>

<script>
const DATA = {"topics": [{"id": "01", "title": "Historia del computador", "summary": ["Babbage (1822) concibió una máquina de cálculo automatizado; Hollerith mecanizó el censo con máquinas tabuladoras.", "ENIAC (1946): primera computadora electrónica de propósito general, 30 toneladas y 174 kW.", "Evolución: tubos de vacío, transistores (1947), circuitos integrados, microprocesador (Intel, 1971), PC, multinúcleo, GPU e IA.", "Ley de Moore: los transistores en un circuito integrado se duplican aproximadamente cada dos años.", "Ley de Amdahl (1967): la parte secuencial de un programa limita el speedup, sin importar cuántos procesadores se agreguen.", "El rendimiento depende de múltiples factores, no solo de los GHz."], "questions": [{"type": "mc", "q": "¿En qué año concibió Charles Babbage la idea de una máquina capaz de realizar cálculos complejos de manera automatizada?", "options": ["1890", "1822", "1946", "1801"], "answer": 1, "explanation": "Las diapositivas indican que en 1822 Babbage concibió esa máquina, sentando las bases de la computación moderna."}, {"type": "mc", "q": "¿Qué aporte se atribuye a las máquinas tabuladoras de Herman Hollerith a finales del siglo XIX?", "options": ["Fueron las primeras computadoras electrónicas de propósito general", "Introdujeron el uso de tubos de vacío en circuitos lógicos", "Mecanizaron tareas de procesamiento de datos como el censo y la contabilidad", "Definieron la era de los mainframes junto al IBM 360"], "answer": 2, "explanation": "Las máquinas tabuladoras de Hollerith revolucionaron el procesamiento de datos al mecanizar tareas como el censo y la contabilidad."}, {"type": "mc", "q": "Según las diapositivas, ¿cuál fue la primera computadora electrónica de propósito general?", "options": ["MARK I de Harvard", "IBM 360", "CDC 6600", "ENIAC"], "answer": 3, "explanation": "El ENIAC, desarrollado en 1946 por la Universidad de Pensilvania, fue la primera computadora electrónica de propósito general."}, {"type": "tf", "q": "El ENIAC pesaba alrededor de 30 toneladas y consumía 174 kilovatios.", "options": ["Verdadero", "Falso"], "answer": 0, "explanation": "Las diapositivas describen al ENIAC con un peso de 30 toneladas y un consumo de 174 kW."}, {"type": "mc", "q": "¿Por qué las computadoras de tubos de vacío fueron reemplazadas por computadoras basadas en transistores?", "options": ["Por su consumo de energía, tamaño y fragilidad", "Porque no podían realizar operaciones lógicas", "Porque no eran programables", "Porque solo funcionaban con tarjetas perforadas"], "answer": 0, "explanation": "Los tubos de vacío fueron reemplazados debido a su consumo de energía, su tamaño y su fragilidad."}, {"type": "tf", "q": "El transistor se inventó en 1971, el mismo año en que Intel presentó el primer microprocesador.", "options": ["Verdadero", "Falso"], "answer": 1, "explanation": "El transistor se inventó en 1947; el microprocesador de Intel es de 1971."}, {"type": "mc", "q": "¿Qué característica del IBM PC (1981) le permitió convertirse en el estándar de la industria?", "options": ["Ser la primera computadora con interfaz gráfica", "Su diseño modular y abierto, que permitió software y hardware compatible", "Ser la primera computadora personal asequible de la historia", "Incorporar el primer procesador multinúcleo"], "answer": 1, "explanation": "El diseño modular y abierto del IBM PC permitió el desarrollo de una amplia gama de software y hardware compatible."}, {"type": "tf", "q": "Según las diapositivas, un computador con más GHz siempre tiene mejor rendimiento que otro con menos GHz.", "options": ["Verdadero", "Falso"], "answer": 1, "explanation": "Las diapositivas aclaran que un computador no siempre es mejor solo por tener más GHz; el rendimiento depende de múltiples factores."}, {"type": "mc", "q": "¿Qué enuncia la Ley de Moore?", "options": ["El rendimiento total está limitado por la parte secuencial del programa", "La frecuencia del procesador se duplica cada año", "El consumo energético por operación se reduce a la mitad cada década", "La cantidad de transistores en un circuito integrado se duplica aproximadamente cada dos años"], "answer": 3, "explanation": "La Ley de Moore establece que el número de transistores en un circuito integrado se duplicaría aproximadamente cada dos años."}, {"type": "mc", "q": "¿Cuál es la idea central de la Ley de Amdahl?", "options": ["Agregar procesadores multiplica el rendimiento de forma proporcional", "El rendimiento total de un sistema está limitado por la parte del programa que no puede ejecutarse en paralelo", "El número de transistores se duplica cada dos años", "El paralelismo no aporta beneficios en sistemas modernos"], "answer": 1, "explanation": "Amdahl demostró en 1967 que la parte no paralelizable de un programa limita el rendimiento total."}, {"type": "mc", "q": "En la fórmula de la Ley de Amdahl, ¿qué representa la variable P?", "options": ["El número de procesadores o núcleos", "El speedup obtenido", "La fracción del programa que puede paralelizarse", "La parte que siempre será secuencial"], "answer": 2, "explanation": "P es la fracción paralelizable; 1-P es la parte secuencial, N el número de procesadores y S el speedup."}, {"type": "mc", "q": "Para un programa con 90 % paralelizable y 10 % secuencial, ¿qué speedup aproximado se obtiene con 32 núcleos según la tabla de las diapositivas?", "options": ["7.80", "32.00", "10.00", "4.71"], "answer": 0, "explanation": "La tabla muestra un speedup de 7.80 con 32 núcleos; el límite teórico con infinitos núcleos es 10.00."}, {"type": "tf", "q": "Para un programa 90 % paralelizable, el speedup máximo alcanzable, incluso con infinitos procesadores, es 10.", "options": ["Verdadero", "Falso"], "answer": 0, "explanation": "Con N tendiendo a infinito, la tabla da un speedup de 10.00, porque el 10 % secuencial fija el límite."}, {"type": "tf", "q": "La Ley de Amdahl afirma que el paralelismo no sirve para mejorar el rendimiento.", "options": ["Verdadero", "Falso"], "answer": 1, "explanation": "La ley no dice que el paralelismo no sirva; afirma que su beneficio disminuye a medida que aumenta el número de procesadores."}, {"type": "mc", "q": "¿Qué tecnología, según las diapositivas, incorpora miles de núcleos simples para cargas altamente paralelizables?", "options": ["TPU", "Multinúcleo", "Microcontrolador", "GPU"], "answer": 3, "explanation": "La GPU incorpora miles de núcleos simples para cargas altamente paralelizables; las TPU y NPU son aceleradores especializados en IA."}]}, {"id": "02", "title": "Organización de computadoras", "summary": ["La organización trata las unidades funcionales y sus interconexiones; la arquitectura, cómo se construyen para cumplir esas funciones.", "Componentes: memoria primaria, registros, unidad de control, unidades de cálculo, buses y dispositivos de E/S.", "El chipset conecta CPU, RAM y ranuras; el Northbridge controla componentes de alta velocidad y el Southbridge la E/S de baja velocidad.", "DDR realiza dos lecturas y dos escrituras por ciclo de reloj; DDR4-2400 significa 2400 MT/s.", "Buses: datos, control y direcciones. Interfaces de almacenamiento: IDE/PATA, SATA y PCIe/NVMe."], "questions": [{"type": "mc", "q": "¿Cuál de los siguientes es un atributo de la arquitectura computacional (y no de la organización), según las diapositivas?", "options": ["La tecnología de la memoria usada", "El número de bits usados para representar los tipos de datos", "Las señales de control en el hardware", "Las interfaces entre la computadora y los periféricos"], "answer": 1, "explanation": "El número de bits para representar tipos de datos y los mecanismos de E/S son atributos de arquitectura; las demás opciones son de organización."}, {"type": "tf", "q": "Las señales de control en el hardware y la tecnología de la memoria usada son atributos de la organización de una computadora.", "options": ["Verdadero", "Falso"], "answer": 0, "explanation": "Las diapositivas listan como atributos de organización las interfaces con periféricos, las señales de control y la tecnología de memoria."}, {"type": "mc", "q": "¿Qué componente interpreta y ejecuta instrucciones y genera las señales de control para habilitar las operaciones?", "options": ["Unidades de cálculo", "Memoria primaria", "Unidad de control", "Buses de interconexión"], "answer": 2, "explanation": "La unidad de control interpreta y ejecuta instrucciones y genera las señales de control."}, {"type": "mc", "q": "¿Cuál de los siguientes NO aparece en las diapositivas como parte física de un procesador?", "options": ["Chipset", "Encapsulado", "Memoria caché", "Coprocesador matemático (FPU)"], "answer": 0, "explanation": "Las partes físicas listadas son encapsulado, caché, FPU y sistema de control (UC y ALU); el chipset está en la placa base."}, {"type": "mc", "q": "¿Qué es el chipset?", "options": ["Un tipo de memoria de alta velocidad dentro del procesador", "El conjunto de chips que controla funciones como la interacción del microprocesador con la memoria o la caché y el control de puertos y slots", "El zócalo donde se instala el procesador", "Un protocolo de acceso a unidades SSD"], "answer": 1, "explanation": "El chipset controla funciones como la interacción CPU-memoria/caché y el control de puertos y slots de expansión."}, {"type": "mc", "q": "¿Qué componente se encarga de controlar los componentes de alta velocidad, como la memoria RAM y las ranuras AGP y PCI-Express?", "options": ["Southbridge", "Southbridge a través del bus PCI", "Controlador IDE", "Northbridge"], "answer": 3, "explanation": "El Northbridge (puente norte) controla los componentes de alta velocidad: microprocesador, RAM, AGP/PCI-Express y la conexión al Southbridge."}, {"type": "tf", "q": "El Southbridge se comunica directamente con la CPU, sin pasar por el Northbridge.", "options": ["Verdadero", "Falso"], "answer": 1, "explanation": "Las diapositivas indican que el Southbridge no se comunica directamente con la CPU, sino a través del Northbridge."}, {"type": "mc", "q": "¿Con qué otro nombre se conoce al Southbridge?", "options": ["I/O Controller Hub (Concentrador de Controladores de E/S)", "Memory Controller Hub", "Front Side Bus", "Unidad de control"], "answer": 0, "explanation": "El Southbridge también se llama puente sur o I/O Controller Hub."}, {"type": "mc", "q": "¿Qué significa la cifra 2400 en un módulo identificado como DDR4-2400?", "options": ["Una capacidad de 2400 MB", "Una frecuencia de 2400 GHz", "Una tasa de transferencia de 2400 MT/s", "Un voltaje de 2.4 V"], "answer": 2, "explanation": "Según las diapositivas, DDR4-2400 indica una tasa de transferencia de 2400 MT/s."}, {"type": "tf", "q": "Las memorias DDR pueden realizar dos tareas de escritura y dos de lectura por cada ciclo de reloj.", "options": ["Verdadero", "Falso"], "answer": 0, "explanation": "Esa es la característica común a todas las generaciones DDR (Double Data Rate)."}, {"type": "mc", "q": "¿Cuáles son los tres tipos de bus que se diferencian en las diapositivas?", "options": ["Serie, paralelo y USB", "Interno, externo y de expansión", "PCI, AGP e IDE", "Datos, control y direcciones"], "answer": 3, "explanation": "Los buses se diferencian en bus de datos, bus de control y bus de direcciones."}, {"type": "tf", "q": "Un CD o un DVD es un periférico, según la definición de las diapositivas.", "options": ["Verdadero", "Falso"], "answer": 1, "explanation": "Las diapositivas advierten no confundir periféricos con dispositivos de soporte de información, como CD, DVD o disquete."}, {"type": "mc", "q": "Según la tabla de SATA, ¿cuál es la velocidad real de SATA 3?", "options": ["150 MB/s", "600 MB/s", "300 MB/s", "6000 MB/s"], "answer": 1, "explanation": "SATA 3 opera a 6000 MHz con codificación 8b10b (80 %), lo que da una velocidad real de 600 MB/s."}, {"type": "mc", "q": "¿Qué interfaz nació a principios de la década de 2000 para reemplazar a IDE (Parallel ATA)?", "options": ["SATA", "NVMe", "Thunderbolt", "Firewire"], "answer": 0, "explanation": "SATA nació a principios de los 2000 para reemplazar a IDE/PATA, ofreciendo mejor velocidad y estabilidad."}, {"type": "mc", "q": "¿A través de qué bus accede el protocolo NVMe al almacenamiento flash?", "options": ["SATA", "IDE", "USB", "PCI Express (PCIe)"], "answer": 3, "explanation": "NVMe accede al almacenamiento flash a través del bus PCIe, que admite decenas de miles de colas de comando paralelas."}]}, {"id": "03", "title": "CPU", "summary": ["La arquitectura del computador incluye la ISA, el diseño del hardware y las técnicas de gestión y procesamiento de datos.", "Von Neumann usa un mismo espacio de memoria para instrucciones y datos; Harvard los separa.", "RISC (ARM, MIPS, SPARC) usa instrucciones reducidas; CISC (x86, VAX) instrucciones amplias y complejas; EPIC y VLIW explotan el paralelismo.", "El procesador se compone de unidad de control, ALU, registros, caché y buses.", "MIPS: arquitectura RISC con instrucciones de 32 bits, 32 registros de propósito general y pipeline de cinco etapas."], "questions": [{"type": "mc", "q": "¿Qué arquitectura utiliza el mismo espacio de memoria para instrucciones y datos?", "options": ["Harvard", "Von Neumann", "VLIW", "EPIC"], "answer": 1, "explanation": "La arquitectura Von Neumann conecta CPU, memoria y E/S por buses y usa el mismo espacio de memoria para instrucciones y datos."}, {"type": "tf", "q": "La arquitectura Harvard separa la memoria de instrucciones de la memoria de datos, lo que permite accesos simultáneos.", "options": ["Verdadero", "Falso"], "answer": 0, "explanation": "Así se describe la arquitectura Harvard; se usa en microcontroladores y DSP."}, {"type": "mc", "q": "¿Cuál de los siguientes es un ejemplo de arquitectura CISC según las diapositivas?", "options": ["ARM", "MIPS", "Intel x86", "SPARC"], "answer": 2, "explanation": "Intel x86 y VAX son ejemplos CISC; ARM, MIPS y SPARC son RISC."}, {"type": "mc", "q": "¿Qué arquitectura permite ejecutar múltiples instrucciones en paralelo mediante la especificación explícita de la paralelización en el código, como en Intel Itanium?", "options": ["EPIC", "VLIW", "CISC", "Harvard"], "answer": 0, "explanation": "EPIC (Explicitly Parallel Instruction Computing) especifica explícitamente el paralelismo en el código; su ejemplo es Intel Itanium."}, {"type": "mc", "q": "¿Por qué los dispositivos móviles y embebidos suelen usar arquitecturas RISC como ARM?", "options": ["Por su compatibilidad con una amplia gama de aplicaciones de escritorio", "Porque ejecutan instrucciones largas con múltiples operaciones", "Porque reducen el número de instrucciones para tareas complejas", "Por su eficiencia energética y rendimiento"], "answer": 3, "explanation": "Las diapositivas indican que los móviles y embebidos usan RISC por su eficiencia energética y rendimiento."}, {"type": "tf", "q": "Los procesadores RISC generalmente ejecutan una instrucción por ciclo de reloj.", "options": ["Verdadero", "Falso"], "answer": 0, "explanation": "La descripción de RISC en las diapositivas señala que generalmente ejecutan una instrucción por ciclo de reloj."}, {"type": "mc", "q": "¿Qué componente del procesador consiste en pequeñas áreas de almacenamiento rápido que guardan datos temporales y direcciones?", "options": ["Caché", "Buses", "Registros", "Unidad de control"], "answer": 2, "explanation": "Los registros son pequeñas áreas de almacenamiento rápido dentro del procesador para datos temporales y direcciones."}, {"type": "mc", "q": "¿Cuál es la longitud de todas las instrucciones MIPS?", "options": ["16 bits", "32 bits", "Variable, entre 8 y 64 bits", "64 bits"], "answer": 1, "explanation": "Todas las instrucciones MIPS tienen una longitud fija de 32 bits."}, {"type": "mc", "q": "¿Cuál es el orden correcto de las cinco etapas del pipeline MIPS?", "options": ["Búsqueda, decodificación, ejecución, acceso a memoria y escritura", "Decodificación, búsqueda, ejecución, escritura y acceso a memoria", "Búsqueda, ejecución, decodificación, escritura y acceso a memoria", "Acceso a memoria, búsqueda, decodificación, ejecución y escritura"], "answer": 0, "explanation": "El pipeline MIPS divide la ejecución en búsqueda, decodificación, ejecución, acceso a memoria y escritura."}, {"type": "mc", "q": "¿Para qué se usan los registros especiales HI y LO en MIPS?", "options": ["Para almacenar la dirección de retorno", "Para apuntar al tope de la pila", "Para la entrada y salida mediante syscall", "Para productos y divisiones"], "answer": 3, "explanation": "HI-LO son registros de propósito específico para productos y divisiones."}, {"type": "tf", "q": "En MIPS, el registro $zero ($0) contiene siempre el valor constante 0 y no es modificable.", "options": ["Verdadero", "Falso"], "answer": 0, "explanation": "Según el convenio de registros, $zero ($0) tiene el valor constante 0 y no puede modificarse."}, {"type": "mc", "q": "¿Qué registro de MIPS guarda la dirección de retorno y se usa implícitamente en la instrucción jal?", "options": ["$sp ($29)", "$fp ($30)", "$ra ($31)", "$gp ($28)"], "answer": 2, "explanation": "$ra ($31) contiene la dirección de retorno y lo usa implícitamente jal."}, {"type": "tf", "q": "Los registros $t0 a $t9 se respetan (se preservan) en las llamadas a subprogramas.", "options": ["Verdadero", "Falso"], "answer": 1, "explanation": "Los $t son temporales no respetados en llamadas; los que se respetan son $s0 a $s7."}, {"type": "mc", "q": "En MIPS, ¿qué registros se usan para pasar argumentos a subprogramas?", "options": ["$v0 y $v1", "$a0 a $a3", "$s0 a $s7", "$k0 y $k1"], "answer": 1, "explanation": "$a0 a $a3 ($4 a $7) contienen los argumentos; $v0 y $v1 son valores de retorno."}, {"type": "mc", "q": "Para imprimir un entero con syscall en MIPS, ¿qué valor se carga en $v0 y dónde se coloca el entero?", "options": ["$v0 = 1 y el entero en $a0", "$v0 = 5 y el entero en $a0", "$v0 = 4 y el entero en $a1", "$v0 = 1 y el entero en $f12"], "answer": 0, "explanation": "La clase 1 imprime un entero que se pasa en $a0; la clase 5 lee un entero y lo devuelve en $v0."}]}, {"id": "04", "title": "Lenguaje ensamblador", "summary": ["El ensamblador es un lenguaje de bajo nivel que usa nemotécnicos; cada instrucción corresponde a una instrucción de máquina.", "Cada procesador tiene su propia ISA: código x86 no es compatible con ARM o RISC-V.", "Componentes clave: instrucciones, operadores y etiquetas; las directivas (.ORG, .EQU, .DATA, .TEXT) no generan código de máquina.", "MIPS es RISC, de 32 bits, con 32 registros, diseño Load/Store y pipeline de 5 etapas.", "Formatos MIPS: R (registros), I (inmediato de 16 bits) y J (dirección de 26 bits).", "La E/S en MIPS usa syscall: $v0 lleva el código de operación y $a0-$a3 los parámetros."], "questions": [{"type": "mc", "q": "¿Cuál de las siguientes afirmaciones describe mejor el lenguaje ensamblador?", "options": ["Un lenguaje de alto nivel independiente del procesador", "Un lenguaje de bajo nivel que usa nemotécnicos, donde cada instrucción corresponde a una instrucción de máquina", "Un formato binario que el procesador ejecuta sin traducción", "Un lenguaje interpretado que se traduce a C antes de ejecutarse"], "answer": 1, "explanation": "Según las diapositivas, el ensamblador es de bajo nivel, usa nemotécnicos y cada instrucción corresponde directamente a una instrucción que el procesador puede ejecutar."}, {"type": "tf", "q": "Un programa escrito en ensamblador para x86 puede ejecutarse sin cambios en un procesador ARM.", "options": ["Verdadero", "Falso"], "answer": 1, "explanation": "Cada procesador tiene su propia ISA, por lo que el código ensamblador de x86 no es compatible con ARM o RISC-V."}, {"type": "mc", "q": "¿Qué caracteriza a las directivas del ensamblador?", "options": ["Se traducen a instrucciones de máquina equivalentes", "Solo se usan para realizar saltos condicionales", "No generan código de máquina; guían al ensamblador en la organización del código y la asignación de memoria", "Se ejecutan en el procesador antes que el resto del programa"], "answer": 2, "explanation": "Las directivas no generan código de máquina; indican al ensamblador cómo estructurar el código y asignar memoria."}, {"type": "mc", "q": "¿Qué directiva define una constante simbólica asignando un nombre a un valor específico?", "options": [".ORG", ".DATA", ".TEXT", ".EQU"], "answer": 3, "explanation": ".EQU define una constante simbólica; .ORG fija la dirección, .DATA y .TEXT marcan las secciones de datos y de código."}, {"type": "mc", "q": "En el modo de direccionamiento indirecto, el operador:", "options": ["Contiene la dirección de memoria que contiene la dirección del dato", "Especifica directamente la dirección de memoria del dato", "Es un registro que contiene el dato", "Es un valor inmediato codificado en la instrucción"], "answer": 0, "explanation": "En el modo indirecto el operador contiene la dirección de memoria que a su vez contiene la dirección del dato."}, {"type": "tf", "q": "La arquitectura MIPS sigue un diseño Load/Store: las operaciones de datos se realizan en registros y solo instrucciones de carga y almacenamiento acceden a memoria.", "options": ["Verdadero", "Falso"], "answer": 0, "explanation": "El diseño Load/Store de MIPS solo permite operar datos en registros y usa instrucciones específicas de load y store para la memoria."}, {"type": "mc", "q": "¿Cuáles son, en orden, las 5 etapas del pipeline de MIPS mencionadas en clase?", "options": ["Decodificación, búsqueda, ejecución, escritura, acceso a memoria", "Búsqueda, decodificación, ejecución, acceso a memoria y escritura de resultado", "Búsqueda, ejecución, decodificación, escritura y acceso a memoria", "Carga, almacenamiento, ejecución, salto y escritura"], "answer": 1, "explanation": "MIPS usa una canalización de 5 etapas: búsqueda, decodificación, ejecución, acceso a memoria y escritura de resultado."}, {"type": "mc", "q": "Según la convención de uso de registros MIPS, ¿qué registros deben preservarse en las llamadas a funciones?", "options": ["$t0-$t9", "$a0-$a3", "$v0-$v1", "$s0-$s7"], "answer": 3, "explanation": "Los registros $s0-$s7 (Saved) son variables que perduran y deben preservarse; $t, $a y $v no se preservan."}, {"type": "tf", "q": "El registro $zero de MIPS siempre contiene el valor 0 y es inmutable.", "options": ["Verdadero", "Falso"], "answer": 0, "explanation": "Las diapositivas indican que $zero siempre contiene el valor 0 y es inmutable."}, {"type": "mc", "q": "¿A qué formato de instrucción MIPS pertenecen lw, sw, beq y addi?", "options": ["Formato R", "Formato J", "Formato I", "Formato de pseudoinstrucción"], "answer": 2, "explanation": "El formato I (Immediate) opera entre un registro y un valor inmediato e incluye addi, lw, sw, beq y bne."}, {"type": "mc", "q": "¿De cuántos bits es el campo de dirección en las instrucciones tipo J de MIPS?", "options": ["16 bits", "26 bits", "32 bits", "5 bits"], "answer": 1, "explanation": "Las instrucciones tipo J se codifican en 32 bits con un campo de dirección de 26 bits; las tipo I usan un inmediato de 16 bits."}, {"type": "mc", "q": "Si $s0 = 3 y $t0 = 7, ¿qué valor queda en $s7 después de ejecutar:\nslt $s7, $s0, $t0", "options": ["0", "3", "7", "1"], "answer": 3, "explanation": "slt asigna $s7 = ($s0 < $t0) ? 1 : 0; como 3 < 7, $s7 = 1."}, {"type": "mc", "q": "En el bucle WHILE de clase:\nli $s3, 0\nli $s4, 10\nLoop: slt $t0, $s3, $s4\nbeq $t0, $zero, End\naddi $s3, $s3, 1\nj Loop\nEnd:\n¿Cuál es el valor de $s3 al llegar a End?", "options": ["9", "11", "10", "0"], "answer": 2, "explanation": "El bucle incrementa i mientras i < 10; cuando $s3 = 10, slt deja $t0 = 0 y beq salta a End."}, {"type": "mc", "q": "Para imprimir un entero con syscall en MIPS, ¿qué valor se carga en $v0?", "options": ["1", "4", "5", "8"], "answer": 0, "explanation": "Imprimir entero usa li $v0, 1; el 4 imprime cadenas, el 5 lee enteros y el 8 lee cadenas."}, {"type": "tf", "q": "Las instrucciones mfhi y mflo mueven datos desde los registros especiales HI/LO, usados en operaciones como mult y div.", "options": ["Verdadero", "Falso"], "answer": 0, "explanation": "Las operaciones especiales incluyen mfhi/mflo (mover desde HI/LO) y mult/div, que interactúan con esos registros especiales."}]}, {"id": "04R", "title": "Repaso Assembler: MIPS, ARM e Intel", "summary": ["MIPS: RISC con instrucciones de 32 bits fijas, Load/Store y 32 registros; usado como referencia por Patterson & Hennessy.", "ARM: RISC de bajo consumo con ejecución condicional por sufijos (EQ, NE, GT, LT, GE).", "x86: CISC con instrucciones de 1 a 15 bytes, operaciones directas sobre memoria y micro-ops internas tipo RISC.", "MIPS no tiene flags: compara con slt y ramifica con beq/bne; ARM y x86 usan CMP y flags.", "Llamadas a funciones: MIPS jal/$ra, ARM BL/LR, x86 CALL/RET con la pila."], "questions": [{"type": "mc", "q": "¿Cuál es la longitud de las instrucciones en MIPS?", "options": ["Variable, de 1 a 15 bytes", "Exactamente 32 bits", "16 o 32 bits según el formato", "64 bits"], "answer": 1, "explanation": "En MIPS todas las instrucciones miden exactamente 32 bits; la longitud variable de 1 a 15 bytes corresponde a x86."}, {"type": "tf", "q": "x86 en modo 32-bit permite sumar con tres operandos distintos, igual que MIPS y ARM.", "options": ["Verdadero", "Falso"], "answer": 1, "explanation": "x86 en modo 32-bit solo tiene dos operandos: el destino es también una de las fuentes, por eso requiere un MOV previo."}, {"type": "mc", "q": "¿Qué secuencia x86 implementa a = b + c si b está en ebx, c en ecx y el resultado debe quedar en eax?", "options": ["ADD eax, ebx, ecx", "MOV eax, ebx\nADD eax, ecx", "add $eax, $ebx, $ecx", "ADD ebx, ecx\nMOV ebx, eax"], "answer": 1, "explanation": "x86 usa dos instrucciones: eax ← ebx y luego eax ← eax + ecx, por la restricción de dos operandos."}, {"type": "mc", "q": "¿Cómo evalúa MIPS una condición como a < b para un if?", "options": ["Con CMP, que actualiza los flags de estado", "Con sufijos condicionales como ADDLT", "Con slt, que escribe 1 o 0 en un registro, seguido de beq o bne", "Con la instrucción LOOP"], "answer": 2, "explanation": "MIPS no tiene flags de estado; slt construye el booleano en un registro y beq/bne ramifican según ese valor."}, {"type": "mc", "q": "¿Qué característica distingue a ARM frente a MIPS en el manejo de condiciones?", "options": ["ARM no tiene instrucciones de comparación", "ARM solo puede comparar con slt", "ARM obliga a usar la pila para cada comparación", "Muchas instrucciones ARM pueden ejecutarse condicionalmente con sufijos como EQ, NE o GT"], "answer": 3, "explanation": "ARM permite ejecución condicional por sufijos (ADDLT, SUBGE), lo que reduce saltos y mejora el pipeline."}, {"type": "tf", "q": "En ARM, el if/else (a < b) puede implementarse con CMP, ADDLT y SUBGE sin ninguna instrucción de salto (B).", "options": ["Verdadero", "Falso"], "answer": 0, "explanation": "Las diapositivas muestran el if/else completo en ARM usando CMP, ADDLT y SUBGE sin ningún salto B."}, {"type": "mc", "q": "¿Qué hace la instrucción x86 LOOP en el ejemplo del bucle for?", "options": ["Decrementa ecx y salta si no es cero", "Incrementa eax y salta si es negativo", "Compara ecx con 10 y actualiza EFLAGS", "Guarda EIP en la pila y salta"], "answer": 0, "explanation": "LOOP decrementa ecx y salta si no es cero: un bucle completo en una sola instrucción CISC."}, {"type": "mc", "q": "Para calcular la dirección de array[i] en MIPS (elementos de 4 bytes), ¿qué instrucción multiplica el índice por 4?", "options": ["mul $t1, $t0, 4", "srl $t1, $t0, 2", "sll $t1, $t0, 2", "addi $t1, $t0, 4"], "answer": 2, "explanation": "sll $t1, $t0, 2 desplaza dos bits a la izquierda, lo que equivale a multiplicar el índice por 4."}, {"type": "mc", "q": "¿Qué modo de direccionamiento x86 permite escribir MOV [ebx + ecx*4], eax?", "options": ["Load/Store", "SIB (Scale-Index-Base)", "Inmediato", "Directo por registro"], "answer": 1, "explanation": "MOV [ebx + ecx*4], eax usa el modo SIB de x86: base + índice × escala + desplazamiento en un solo operando."}, {"type": "mc", "q": "En ARM, ¿qué instrucción llama a una función guardando la dirección de retorno en el registro LR?", "options": ["jal", "CALL", "BX", "BL"], "answer": 3, "explanation": "BL (Branch and Link) guarda la dirección de retorno en LR; para retornar se usa MOV pc, lr o BX lr."}, {"type": "tf", "q": "En x86, CALL guarda la dirección de retorno en un registro especial similar a $ra, sin usar la pila.", "options": ["Verdadero", "Falso"], "answer": 1, "explanation": "CALL hace push automático de EIP en la pila y RET hace pop; la pila es el mecanismo nativo, no un registro especial."}, {"type": "mc", "q": "En MIPS, ¿por qué una función anidada debe ejecutar sw $ra, 0($sp)?", "options": ["Porque una nueva llamada con jal sobrescribiría $ra, la dirección de retorno", "Porque $ra siempre vale 0", "Porque sw inicializa la pila", "Porque jr no puede leer $ra directamente"], "answer": 0, "explanation": "jal guarda la dirección de retorno en $ra; en funciones anidadas $ra debe guardarse en la pila para no perderla."}, {"type": "mc", "q": "En el if/else de x86, ¿qué hace INC DWORD [ecx]?", "options": ["Incrementa el registro ecx", "Carga c en un registro sin modificarlo", "Incrementa directamente el valor en memoria apuntado por ecx, sin load/store separado", "Salta a la etiqueta ecx"], "answer": 2, "explanation": "INC DWORD [ecx] opera directamente sobre memoria: una sola instrucción hace carga, operación y almacenamiento (estilo CISC)."}, {"type": "mc", "q": "Según la plantilla binaria, ¿qué opcode (6 bits más significativos) tiene la instrucción tipo I addi?", "options": ["000000", "001100", "001101", "001000"], "answer": 3, "explanation": "addi se codifica como 001000 sssss ttttt iiiiiiiiiiiiiiii; 001100 es andi, 001101 es ori y 000000 corresponde a tipo R."}, {"type": "tf", "q": "En la plantilla binaria, add y sub comparten el opcode 000000 y se diferencian por el campo de función (100000 y 100010).", "options": ["Verdadero", "Falso"], "answer": 0, "explanation": "Ambas son tipo R con opcode 000000; add termina en 100000 y sub en 100010."}]}, {"id": "05", "title": "ALU", "summary": ["MIPS ve la memoria como un espacio lineal de 32 bits: hasta 2^32 bytes (4 GB).", "Segmentos: reservado, texto (0x00400000), datos estáticos (0x10000000), heap (crece hacia arriba), pila (crece hacia abajo) y kernel (0x80000000).", "Modos de direccionamiento: inmediato, por registro, base o desplazamiento, relativo al PC y pseudodirecto.", "El semisumador suma dos bits sin acarreo de entrada; el sumador completo suma tres bits y puede encadenarse (Ripple Carry Adder).", "La ALU MIPS opera con datos de 32 bits en un solo ciclo; el multiplicador trabaja por sumas sucesivas y desplazamientos repetidos 32 veces."], "questions": [{"type": "mc", "q": "¿Cuánta memoria puede direccionar un procesador MIPS con un espacio de direccionamiento lineal de 32 bits?", "options": ["2^16 bytes (64 KB)", "2^32 bits (512 MB)", "2^64 bytes", "2^32 bytes (4 GB)"], "answer": 3, "explanation": "Con 32 bits se pueden direccionar 2^32 bytes, es decir 4 GB, de 0x00000000 a 0xFFFFFFFF."}, {"type": "mc", "q": "¿En qué dirección comienza típicamente el segmento de texto en MIPS?", "options": ["0x00400000", "0x10000000", "0x7FFFFFFC", "0x80000000"], "answer": 0, "explanation": "El segmento de texto, donde reside el código de máquina, comienza típicamente en 0x00400000."}, {"type": "tf", "q": "El segmento de texto es de solo lectura para evitar que un programa se modifique a sí mismo por error.", "options": ["Verdadero", "Falso"], "answer": 0, "explanation": "Las diapositivas indican que el segmento de texto es de solo lectura por esa razón."}, {"type": "mc", "q": "¿Cuál de las siguientes afirmaciones sobre el heap y la pila en MIPS es correcta?", "options": ["Ambos crecen hacia direcciones mayores", "El heap crece hacia arriba (direcciones mayores) y la pila crece hacia abajo (direcciones menores)", "El heap crece hacia abajo y la pila crece hacia arriba", "Ambos tienen tamaño fijo definido al inicio del programa"], "answer": 1, "explanation": "El heap crece hacia direcciones mayores; la pila, a diferencia del heap, crece desde direcciones altas hacia bajas."}, {"type": "mc", "q": "¿Qué registro suele apuntar al segmento de datos estáticos para facilitar el acceso a variables globales?", "options": ["$sp", "$ra", "$gp", "$fp"], "answer": 2, "explanation": "El puntero $gp (Global Pointer) suele apuntar a los datos estáticos."}, {"type": "tf", "q": "El segmento del kernel (desde 0x80000000) puede ser accedido libremente por cualquier programa de usuario.", "options": ["Verdadero", "Falso"], "answer": 1, "explanation": "Solo el sistema operativo tiene permiso para ejecutar código o acceder a datos en el segmento del kernel."}, {"type": "mc", "q": "¿Qué modo de direccionamiento es el más rápido porque no requiere acceder a la memoria principal?", "options": ["Base o desplazamiento", "Relativo al PC", "Pseudodirecto", "Por registro"], "answer": 3, "explanation": "En el direccionamiento por registro los operandos están en los registros del procesador, por lo que no se accede a memoria."}, {"type": "mc", "q": "En el direccionamiento base o desplazamiento, ¿cómo se obtiene la dirección del operando?", "options": ["Sumando un registro base y una constante (offset)", "Concatenando los bits superiores del PC con 26 bits de la instrucción", "Sumando una constante al valor actual del PC", "Tomando la constante incluida directamente en la instrucción"], "answer": 0, "explanation": "La dirección se calcula sumando un registro base y una constante de desplazamiento."}, {"type": "mc", "q": "¿Qué modo de direccionamiento se usa para saltos largos concatenando los bits superiores del PC con los 26 bits de la instrucción?", "options": ["Inmediato", "Relativo al PC", "Pseudodirecto", "Por registro"], "answer": 2, "explanation": "El direccionamiento pseudodirecto concatena los bits superiores del PC con los 26 bits de la instrucción desplazados a la izquierda."}, {"type": "mc", "q": "¿Por qué el semisumador recibe el nombre de \"semi\" o \"medio\" sumador?", "options": ["Porque solo suma la mitad de los bits de un número", "Porque no tiene una entrada para un acarreo previo", "Porque no genera acarreo de salida", "Porque solo funciona con números de 16 bits"], "answer": 1, "explanation": "Suma dos bits y genera acarreo, pero no tiene entrada para un acarreo proveniente de una suma anterior."}, {"type": "tf", "q": "Un sumador completo suma tres bits: los operandos A y B y un acarreo de entrada de una etapa anterior.", "options": ["Verdadero", "Falso"], "answer": 0, "explanation": "Así se define el sumador completo (Full Adder) en las diapositivas."}, {"type": "mc", "q": "¿Qué estructura utiliza la ALU de MIPS de 32 bits para encadenar sumadores completos?", "options": ["Ripple Carry Adder (sumador de propagación de acarreo)", "Half Adder en paralelo", "Multiplicador por desplazamiento", "Pipeline de cinco etapas"], "answer": 0, "explanation": "La ALU MIPS de 32 bits encadena sumadores completos mediante un Ripple Carry Adder."}, {"type": "mc", "q": "En la ALU simple de 2 bits de las diapositivas, ¿qué operación corresponde a OP = 010?", "options": ["XOR", "AND", "Adición", "OR"], "answer": 3, "explanation": "Los códigos son 000 = XOR, 001 = AND, 010 = OR y 011 = Adición."}, {"type": "tf", "q": "En muchos diseños, el bloque multiplicador opera de forma independiente a la ALU principal para no penalizar el ciclo de reloj.", "options": ["Verdadero", "Falso"], "answer": 0, "explanation": "Multiplicar requiere más pasos lógicos que sumar, por eso el multiplicador suele ser un bloque independiente."}, {"type": "mc", "q": "En el algoritmo del multiplicador, si el bit menos significativo del multiplicador es 1, ¿qué se hace?", "options": ["Se resta el multiplicando del acumulador", "Se desplaza el acumulador a la derecha sin sumar", "Se suma el multiplicando al acumulador", "Se termina el proceso"], "answer": 2, "explanation": "Si el bit es 1 se suma el multiplicando al acumulador; luego se desplazan multiplicando (izquierda) y multiplicador (derecha), 32 veces."}]}, {"id": "06", "title": "RISC, CISC y microarquitectura", "summary": ["La ISA es el 'contrato' entre hardware y software (el 'qué'); la microarquitectura es su implementación física (el 'cómo').", "CISC: instrucciones complejas de longitud variable, operaciones directas en memoria, microprogramación y múltiples ciclos.", "RISC: instrucciones simples de tamaño fijo, Load/Store, muchos registros (32+), optimizado para canalización.", "Los procesadores x86 modernos son híbridos: ISA CISC externa y micro-ops tipo RISC internas.", "Estrategias de microarquitectura: pipeline, ejecución fuera de orden, predicción de saltos y optimización energética."], "questions": [{"type": "mc", "q": "¿Cuál es la diferencia entre arquitectura (ISA) y microarquitectura?", "options": ["La ISA es el 'cómo' y la microarquitectura es el 'qué'", "Son sinónimos", "La ISA define el 'qué' puede hacer el procesador y la microarquitectura el 'cómo' lo hace en hardware", "La microarquitectura define el repertorio de instrucciones y la ISA la caché"], "answer": 2, "explanation": "La ISA es el 'qué' (contrato hardware-software) y la microarquitectura es el 'cómo', la implementación concreta en hardware."}, {"type": "tf", "q": "Dos procesadores pueden compartir la misma arquitectura (ejecutar las mismas instrucciones) y tener microarquitecturas completamente diferentes.", "options": ["Verdadero", "Falso"], "answer": 0, "explanation": "Las diapositivas lo afirman explícitamente: misma ISA, microarquitecturas distintas."}, {"type": "mc", "q": "¿Por qué surgió la filosofía CISC?", "options": ["Porque los compiladores eran muy sofisticados", "Porque la memoria era extremadamente costosa y limitada, y se buscaban programas compactos", "Porque se necesitaba bajo consumo en móviles", "Porque los registros eran baratos y abundantes"], "answer": 1, "explanation": "CISC surgió cuando la memoria era cara y limitada; empaquetar operaciones en una instrucción generaba programas más compactos."}, {"type": "mc", "q": "En CISC, ¿qué es la microprogramación?", "options": ["La traducción de C a ensamblador", "El uso de instrucciones de tamaño fijo", "La ejecución fuera de orden", "La descomposición de instrucciones complejas en microinstrucciones mediante microprogramas en una ROM interna"], "answer": 3, "explanation": "El procesador CISC contiene una ROM interna con microprogramas que traducen cada instrucción a operaciones elementales."}, {"type": "mc", "q": "¿Cuál de las siguientes es una desventaja de CISC según las diapositivas?", "options": ["Dificultad para canalización por la longitud variable y complejidad de las instrucciones", "Código de programa más grande", "Falta de compatibilidad con software antiguo", "Necesidad de compiladores más sofisticados"], "answer": 0, "explanation": "La longitud variable y la complejidad complican técnicas como el pipelining; código más grande y compiladores complejos son desventajas de RISC."}, {"type": "tf", "q": "RISC surgió en los años 80 tras observar que la mayoría de los programas usaban solo un pequeño subconjunto de las instrucciones disponibles.", "options": ["Verdadero", "Falso"], "answer": 0, "explanation": "Las diapositivas indican que RISC respondió a la complejidad de CISC tras ese hallazgo de los investigadores."}, {"type": "mc", "q": "¿Qué característica es propia de RISC?", "options": ["Instrucciones de longitud variable", "Cualquier instrucción puede acceder a memoria", "Instrucciones de tamaño fijo y acceso a memoria solo con LOAD/STORE", "Pocos registros (8-16)"], "answer": 2, "explanation": "RISC usa instrucciones de tamaño fijo y arquitectura Load/Store; las demás opciones describen CISC."}, {"type": "mc", "q": "¿Cuál es una desventaja de RISC?", "options": ["Mayor consumo energético", "Mayor número de instrucciones para tareas complejas, lo que aumenta el tamaño del código", "Dificultad para implementar pipelining", "Hardware de alta complejidad"], "answer": 1, "explanation": "RISC necesita más instrucciones para tareas complejas, aumentando el tamaño del código y la presión en memoria."}, {"type": "mc", "q": "La instrucción hipotética MULDIV [memoria1], [memoria2], 5, [memoria3] ilustra que en CISC:", "options": ["Cada instrucción se ejecuta en un solo ciclo", "Solo las instrucciones LOAD/STORE acceden a memoria", "El compilador debe descomponer la operación en varias instrucciones", "Una sola instrucción visible al programador se descompone internamente en varias microoperaciones"], "answer": 3, "explanation": "El programador ve una sola instrucción potente, pero el hardware la descompone en microoperaciones ejecutadas en secuencia."}, {"type": "tf", "q": "Los procesadores Intel modernos presentan externamente un ISA CISC (x86) pero internamente decodifican a micro-ops tipo RISC.", "options": ["Verdadero", "Falso"], "answer": 0, "explanation": "Es la microarquitectura híbrida descrita en clase, que mantiene compatibilidad y aprovecha la ejecución RISC."}, {"type": "mc", "q": "¿Qué estrategia de microarquitectura permite ejecutar instrucciones en un orden diferente al escrito, sin violar dependencias de datos?", "options": ["Predicción de saltos", "Ejecución fuera de orden", "Microprogramación", "Escalado dinámico de frecuencia"], "answer": 1, "explanation": "La ejecución fuera de orden aprovecha mejor los recursos siempre que no viole dependencias de datos."}, {"type": "mc", "q": "¿Qué estrategia intenta adivinar el resultado de instrucciones condicionales para evitar detener el pipeline?", "options": ["Ejecución fuera de orden", "Optimización energética", "Predicción de saltos", "Canalización"], "answer": 2, "explanation": "La predicción de saltos evita detener el pipeline, crucial en código con muchas bifurcaciones."}, {"type": "mc", "q": "Según la tabla comparativa, ¿qué ejemplos corresponden a arquitecturas CISC?", "options": ["x86, x86-64, Motorola 68k", "ARM, MIPS, RISC-V", "ARM, x86, MIPS", "RISC-V, Motorola 68k, ARM"], "answer": 0, "explanation": "La tabla lista ARM, MIPS y RISC-V como RISC; x86, x86-64 y Motorola 68k como CISC."}, {"type": "tf", "q": "Según la tabla comparativa, RISC tiene una facilidad de canalización Media-Baja y CISC Alta.", "options": ["Verdadero", "Falso"], "answer": 1, "explanation": "Es al revés: RISC tiene facilidad de canalización Alta y CISC Media-Baja."}]}, {"id": "07", "title": "Ejecución de instrucciones", "summary": ["Las instrucciones MIPS tienen tamaño fijo de 32 bits y tres tipos: R, I y J.", "Ciclo de ejecución en 5 fases: Fetch, Decode, Execute, Memory y Writeback.", "El PC contiene la dirección de la siguiente instrucción; la caché de instrucciones reduce el tiempo de acceso.", "El banco de registros tiene 32 registros ($0-$31); la ALU suma, resta, AND, OR, desplaza y compara; la unidad de control genera las señales.", "En ciclo único el periodo lo fija la instrucción más lenta (load, 8 ns, 125 MHz); multiciclo usa una máquina de estados.", "La caché de datos requiere políticas de escritura: write-through y write-back."], "questions": [{"type": "mc", "q": "¿Cuál es el orden correcto de las cinco fases del ciclo de ejecución de instrucciones?", "options": ["Decode, Fetch, Execute, Writeback, Memory", "Fetch, Execute, Decode, Memory, Writeback", "Fetch, Decode, Memory, Execute, Writeback", "Fetch, Decode, Execute, Memory, Writeback"], "answer": 3, "explanation": "El ciclo se divide en Fetch, Decode, Execute, Memory y Writeback, en ese orden."}, {"type": "mc", "q": "¿Qué contiene el Contador de Programa (PC)?", "options": ["El resultado de la última operación de la ALU", "La dirección de la siguiente instrucción a ejecutar", "El código de operación de la instrucción actual", "El número de ciclos ejecutados"], "answer": 1, "explanation": "El PC contiene la dirección de la siguiente instrucción; en Fetch se usa para leer la memoria de instrucciones y luego se incrementa."}, {"type": "tf", "q": "En la fase de Writeback, el resultado de la operación se guarda en el banco de registros.", "options": ["Verdadero", "Falso"], "answer": 0, "explanation": "Writeback guarda el resultado en el registro de destino del banco de registros."}, {"type": "mc", "q": "¿Qué ocurre ante un fallo de caché de instrucciones?", "options": ["La instrucción se descarta", "El PC se reinicia a cero", "La instrucción se busca en la memoria principal y se copia en la caché para futuros accesos", "La CPU genera una excepción y termina el programa"], "answer": 2, "explanation": "Si la instrucción no está en caché, se busca en la memoria principal y se copia en la caché."}, {"type": "mc", "q": "¿En qué fase se generan las señales de control que dirigen la ALU, el banco de registros y la memoria?", "options": ["Decode", "Fetch", "Memory", "Writeback"], "answer": 0, "explanation": "A partir de la decodificación se generan las señales de control para las unidades del procesador."}, {"type": "mc", "q": "¿Cuántos registros de propósito general tiene el banco de registros de MIPS?", "options": ["16, numerados del $0 al $15", "8, numerados del $0 al $7", "64, numerados del $0 al $63", "32, numerados del $0 al $31"], "answer": 3, "explanation": "El banco de registros MIPS consta de 32 registros de propósito general, del $0 al $31."}, {"type": "tf", "q": "Una palabra de 4 bytes debe estar alineada en una dirección de memoria múltiplo de 4; la falta de alineación puede causar accesos más lentos o errores.", "options": ["Verdadero", "Falso"], "answer": 0, "explanation": "Las diapositivas indican que los datos deben alinearse en múltiplos de su tamaño, como una palabra en múltiplo de 4."}, {"type": "mc", "q": "¿Qué necesita la caché de datos que no requiere la caché de instrucciones, según las diapositivas?", "options": ["Bits de validez", "Políticas de escritura como write-through y write-back", "Etiquetas", "Líneas de caché"], "answer": 1, "explanation": "La caché de datos necesita políticas de escritura (write-through, write-back) para la coherencia con la memoria principal."}, {"type": "mc", "q": "¿Cómo se calcula la dirección efectiva en las instrucciones de carga y almacenamiento?", "options": ["Multiplicando el registro base por el desplazamiento", "Usando siempre una dirección absoluta de 26 bits", "Sumando un desplazamiento (immediate) a un registro base", "Tomando el valor actual del PC"], "answer": 2, "explanation": "La dirección efectiva se obtiene sumando el desplazamiento inmediato a un registro base."}, {"type": "mc", "q": "En el procesador de ciclo único del ejemplo (acceso a instrucción 2 ns, leer registro 1 ns, ALU 2 ns, caché de datos 2 ns, escritura de registro 1 ns), ¿cuál es el periodo y la velocidad de reloj?", "options": ["6 ns y 166 MHz", "8 ns y 125 MHz", "6.36 ns y 157 MHz", "5 ns y 200 MHz"], "answer": 1, "explanation": "El load recorre todas las etapas: 2+1+2+2+1 = 8 ns, lo que da 125 MHz."}, {"type": "mc", "q": "Según la tabla de tiempos, ¿por qué una instrucción tipo R tarda 6 ns frente a los 8 ns de load?", "options": ["Porque no realiza escritura en registro", "Porque solo hace fetch y decodificación", "Porque no usa la ALU", "Porque no accede a la caché de datos"], "answer": 3, "explanation": "Tipo R tarda 6 ns porque no accede a la caché de datos; store (7 ns) es la que no escribe en registro."}, {"type": "tf", "q": "Según la tabla de tiempos, la instrucción Jump tarda 3 ns porque solo requiere fetch y decodificación de la instrucción.", "options": ["Verdadero", "Falso"], "answer": 0, "explanation": "La tabla indica Jump 3 ns: fetch + decodificación de instrucción."}, {"type": "mc", "q": "En la unidad de salto, ¿qué componente selecciona entre la dirección de salto y la siguiente dirección secuencial?", "options": ["El comparador", "La ALU", "El multiplexor", "La caché de instrucciones"], "answer": 2, "explanation": "El comparador evalúa la condición y el multiplexor selecciona la dirección de salto o la siguiente secuencial."}, {"type": "mc", "q": "¿Qué afirmación sobre pipeline y ciclo único es correcta?", "options": ["En un procesador pipeline varias instrucciones se ejecutan simultáneamente en distintas fases, con mayor rendimiento pero más complejidad", "El ciclo único ofrece mayor rendimiento que el pipeline", "En ciclo único varias instrucciones se solapan en distintas fases", "El pipeline elimina la necesidad de manejar dependencias"], "answer": 0, "explanation": "El pipeline ejecuta varias instrucciones en fases distintas; da más rendimiento pero exige manejar dependencias y conflictos."}, {"type": "tf", "q": "En una implementación multiciclo, el circuito de control es una máquina de estados con estados para la ejecución normal y estados adicionales para manejo de excepciones.", "options": ["Verdadero", "Falso"], "answer": 0, "explanation": "Las diapositivas describen el control multiciclo como una máquina de estados con estados normales y de excepción."}]}, {"id": "08", "title": "Pipelining y multicore", "summary": ["El pipelining divide cada instrucción en etapas (Fetch, Decode, Execute, Memory access, Write back) que trabajan sobre instrucciones distintas simultáneamente.", "En un pipeline ideal de n etapas el throughput puede aproximarse a n veces el de un procesador secuencial; la latencia de una instrucción individual no disminuye.", "Riesgos: estructurales, de datos (RAW, WAR, WAW) y de control; se mitigan con forwarding, stalling (burbujas) y predicción de saltos.", "Multicore ofrece paralelismo real a nivel de tareas o hilos; cada núcleo tiene ALU, registros, pipeline y caché L1 propios, y comparte caché de último nivel y controladores de memoria.", "Tipos: homogéneas, heterogéneas (big.LITTLE), SMP y AMP; problemas como coherencia de caché se atacan con protocolos MESI/MOESI."], "questions": [{"type": "mc", "q": "¿En qué etapa del pipeline la ALU realiza la operación aritmética, lógica o el cálculo de direcciones de salto?", "options": ["Decode", "Memory access", "Execute", "Write back"], "answer": 2, "explanation": "Según las diapositivas, en la etapa Execute la ALU realiza la operación requerida por la instrucción, incluidos los cálculos de direcciones para saltos."}, {"type": "mc", "q": "¿Qué registro indica, en la etapa Fetch, la dirección de memoria de la siguiente instrucción a ejecutar?", "options": ["El contador de programa (PC)", "El registro de destino", "El acumulador de la ALU", "El registro de estado"], "answer": 0, "explanation": "En Fetch, el contador de programa (PC) indica la dirección de memoria donde se encuentra la instrucción que se ejecuta a continuación."}, {"type": "mc", "q": "En un pipeline ideal de 5 etapas, una vez lleno, ¿a cuánto puede aproximarse el throughput respecto a un procesador secuencial?", "options": ["2 veces", "Igual, solo cambia la latencia", "10 veces", "5 veces"], "answer": 3, "explanation": "En un pipeline ideal de n etapas el throughput puede aproximarse a n veces el de un procesador secuencial; con n = 5, a 5 veces."}, {"type": "tf", "q": "El pipelining reduce el tiempo necesario para completar cada instrucción individual.", "options": ["Verdadero", "Falso"], "answer": 1, "explanation": "Las diapositivas indican que el tiempo de una instrucción individual no disminuye (incluso puede aumentar por la sobrecarga de control); lo que se reduce es el tiempo total del programa."}, {"type": "mc", "q": "Dos instrucciones necesitan al mismo tiempo la única unidad de punto flotante del procesador. ¿Qué tipo de riesgo se presenta?", "options": ["Riesgo de datos RAW", "Riesgo estructural", "Riesgo de control", "Riesgo WAW"], "answer": 1, "explanation": "Los riesgos estructurales ocurren cuando dos o más instrucciones intentan usar el mismo recurso hardware simultáneamente."}, {"type": "mc", "q": "¿Qué técnica envía el resultado de una operación directamente a la entrada de otra etapa sin esperar la escritura en registros?", "options": ["Stalling", "Branch prediction", "Forwarding (adelantamiento)", "Inserción de NO-OP"], "answer": 2, "explanation": "El forwarding permite usar el resultado de la instrucción anterior tan pronto como esté disponible, reduciendo paradas por dependencias RAW."}, {"type": "tf", "q": "El stalling consiste en insertar burbujas o ciclos de espera en el pipeline, lo que reduce el rendimiento global.", "options": ["Verdadero", "Falso"], "answer": 0, "explanation": "El stalling detiene temporalmente una instrucción insertando burbujas; aunque efectivo, introduce ciclos en que no se completa ninguna instrucción."}, {"type": "mc", "q": "¿Qué precisión alcanzan los predictores de saltos modernos según las diapositivas?", "options": ["Superior al 95%", "Cercana al 50%", "Entre 70% y 80%", "Exactamente 100%"], "answer": 0, "explanation": "Los predictores modernos alcanzan precisiones superiores al 95% con algoritmos adaptativos que aprenden de patrones de salto anteriores."}, {"type": "mc", "q": "¿Cuántas etapas suelen tener los pipelines de los procesadores x86 de Intel y AMD, según las diapositivas?", "options": ["5-6 etapas", "8-12 etapas", "14-20 etapas", "30-40 etapas"], "answer": 2, "explanation": "Los x86 de Intel y AMD usan pipelines de 14-20 etapas, mientras que los ARM suelen tener 8-12 para equilibrar rendimiento y eficiencia energética."}, {"type": "mc", "q": "¿Cuál es la diferencia principal entre el paralelismo del pipelining y el de multicore?", "options": ["Pipelining ofrece paralelismo a nivel de tareas; multicore, a nivel de instrucción", "Pipelining ofrece paralelismo a nivel de instrucción; multicore, paralelismo real a nivel de tareas o hilos", "Ambos ofrecen paralelismo únicamente a nivel de instrucción", "Multicore no ofrece paralelismo, solo aumenta la frecuencia"], "answer": 1, "explanation": "Las diapositivas contrastan el pipelining (paralelismo a nivel de instrucción) con multicore, que ofrece paralelismo real a nivel de tareas o hilos."}, {"type": "mc", "q": "¿Qué recurso posee cada núcleo de forma independiente en un procesador multicore?", "options": ["El bus del sistema", "Los controladores de memoria", "La caché de último nivel", "La caché de primer nivel"], "answer": 3, "explanation": "Cada núcleo tiene su propia ALU, registros, pipeline y caché de primer nivel; bus, controladores de memoria y algunos niveles de caché se comparten."}, {"type": "tf", "q": "ARM big.LITTLE es un ejemplo de arquitectura multicore homogénea.", "options": ["Verdadero", "Falso"], "answer": 1, "explanation": "big.LITTLE y DynamicIQ son ejemplos de arquitecturas heterogéneas, que combinan núcleos orientados al rendimiento y a la eficiencia energética."}, {"type": "mc", "q": "Arquitectura en la que todos los núcleos se tratan por igual, comparten el mismo espacio de memoria y el sistema operativo puede asignar cualquier tarea a cualquier núcleo:", "options": ["AMP (asimétrica)", "Heterogénea", "SMP (simétrica)", "NUMA"], "answer": 2, "explanation": "En SMP todos los núcleos se tratan por igual y tienen acceso idéntico a memoria y E/S, lo que simplifica la programación."}, {"type": "mc", "q": "¿Qué solución de hardware proponen las diapositivas para el problema de coherencia de caché?", "options": ["Prefetching de hardware", "Protocolos MESI/MOESI", "Múltiples controladores de memoria", "Instrucciones atómicas"], "answer": 1, "explanation": "La tabla de soluciones asocia la coherencia de caché con los protocolos MESI/MOESI en hardware y con minimizar datos compartidos en software."}, {"type": "mc", "q": "¿Para qué tipo de paralelismo está orientado MPI?", "options": ["Memoria compartida mediante directivas de compilador", "Programación de GPUs", "Memoria distribuida mediante paso de mensajes", "Paralelismo a nivel de instrucción"], "answer": 2, "explanation": "MPI es el estándar para paralelismo de memoria distribuida mediante paso de mensajes; OpenMP es para memoria compartida."}]}, {"id": "09", "title": "Jerarquía de memoria", "summary": ["La jerarquía organiza las memorias según velocidad, tamaño, costo y proximidad al procesador: registros, caché (L1, L2, L3), RAM y almacenamiento secundario.", "Las memorias cercanas al procesador son más rápidas y costosas pero de menor capacidad.", "Se basa en el principio de localidad: temporal (reutilizar datos recientes) y espacial (acceder a datos cercanos).", "SRAM usa flip-flops (4 a 6 transistores), es rápida y se usa en caché; DRAM usa un transistor y un condensador, es más densa y requiere refresco.", "Las generaciones DDR aumentan la velocidad y reducen el voltaje: DDR 2.5V, DDR2 1.8V, DDR3 1.5V, DDR4 1.2V, DDR5 1.1V."], "questions": [{"type": "mc", "q": "¿Cuál es el nivel de la jerarquía de memoria más cercano al procesador?", "options": ["Caché L1", "Registros del procesador", "Memoria RAM", "Caché L3"], "answer": 1, "explanation": "Los registros son el nivel más cercano al procesador: muy rápidos, pero con capacidad de decenas a cientos de bytes."}, {"type": "tf", "q": "Las memorias más alejadas del procesador son más lentas, pero tienen mayor capacidad y son más económicas.", "options": ["Verdadero", "Falso"], "answer": 0, "explanation": "Según las diapositivas, RAM y almacenamiento secundario son más lentos, pero con mayor capacidad y menor costo."}, {"type": "mc", "q": "¿Qué nivel de caché suele estar compartido entre varios núcleos en sistemas multinúcleo?", "options": ["L1", "L2", "L3", "Ninguno, todas son privadas"], "answer": 2, "explanation": "La caché L3 es más grande y más lenta que L2 y suele estar compartida entre varios núcleos."}, {"type": "mc", "q": "Una variable utilizada repetidamente dentro de un bucle es un ejemplo de:", "options": ["Localidad espacial", "Pre-fetching", "Memoria virtual", "Localidad temporal"], "answer": 3, "explanation": "La localidad temporal es la tendencia de que un dato accedido recientemente se acceda de nuevo pronto, como una variable dentro de un bucle."}, {"type": "mc", "q": "Un programa recorre un array elemento por elemento y la caché carga bloques de datos contiguos. ¿Qué principio se aprovecha?", "options": ["Localidad espacial", "Localidad temporal", "Refrescamiento", "Acceso secuencial obligatorio"], "answer": 0, "explanation": "La localidad espacial supone que se accederá a direcciones cercanas, por lo que se cargan bloques contiguos (pre-fetching)."}, {"type": "tf", "q": "Cuando el dato no se encuentra en la caché se produce un cache miss y el procesador accede al siguiente nivel, la RAM.", "options": ["Verdadero", "Falso"], "answer": 0, "explanation": "Si el dato no está en registros ni caché (cache miss), se accede a la RAM y, si tampoco está allí, al almacenamiento secundario."}, {"type": "mc", "q": "¿Cómo está construida cada celda de una SRAM?", "options": ["Con un transistor y un condensador", "Con un flip-flop de 4 a 6 transistores", "Con una celda magnética", "Con un único condensador sin transistor"], "answer": 1, "explanation": "En la SRAM cada celda es un flip-flop de 4 a 6 transistores que mantiene el bit sin necesidad de refresco."}, {"type": "mc", "q": "¿Por qué la DRAM necesita ser refrescada periódicamente?", "options": ["Porque el flip-flop pierde su estado al leerse", "Porque el reloj del procesador lo exige", "Porque el condensador pierde carga con el tiempo por fugas eléctricas", "Porque las líneas de bit se desconectan"], "answer": 2, "explanation": "El condensador de la celda DRAM pierde carga por fugas, por lo que cada bit se lee y reescribe cada pocos milisegundos."}, {"type": "tf", "q": "La DRAM es más rápida que la SRAM y por eso se utiliza principalmente en las memorias caché.", "options": ["Verdadero", "Falso"], "answer": 1, "explanation": "Es al revés: la SRAM es más rápida y se usa en cachés; la DRAM es más lenta, más barata y densa, y es la RAM principal."}, {"type": "mc", "q": "En la matriz de celdas de la RAM, ¿qué líneas corren horizontalmente y seleccionan la fila a leer o escribir?", "options": ["Líneas de bit (Bit Lines)", "Líneas de dirección de columna", "Líneas de datos del bus", "Líneas de palabra (Word Lines)"], "answer": 3, "explanation": "Las líneas de palabra recorren las filas y las seleccionan; las líneas de bit recorren las columnas y transportan los datos."}, {"type": "mc", "q": "¿Qué caracteriza a la memoria DDR frente a la SDRAM tradicional?", "options": ["Transfiere datos en ambas fases del ciclo de reloj", "Usa flip-flops en lugar de condensadores", "No necesita sincronización con el reloj", "Es no volátil"], "answer": 0, "explanation": "DDR transfiere datos en la subida y la bajada del ciclo de reloj, duplicando la tasa de transferencia efectiva."}, {"type": "mc", "q": "¿Cuál es el voltaje de operación de la memoria DDR4 según las diapositivas?", "options": ["1.5V", "1.8V", "1.2V", "1.1V"], "answer": 2, "explanation": "La tabla comparativa indica DDR 2.5V, DDR2 1.8V, DDR3 1.5V, DDR4 1.2V y DDR5 1.1V."}, {"type": "mc", "q": "¿Qué característica nueva introduce DDR5 que divide los módulos en canales independientes?", "options": ["Doble tasa de datos", "Subcanalización", "Refresco automático", "Corrección de errores ECC por primera vez"], "answer": 1, "explanation": "DDR5 introduce la subcanalización, que divide los módulos en subcanales independientes para mejorar la eficiencia de transferencia."}, {"type": "mc", "q": "¿Qué rango de velocidad de transferencia corresponde a DDR3?", "options": ["200-400 MT/s", "400-1066 MT/s", "1600-3200 MT/s", "800-2133 MT/s"], "answer": 3, "explanation": "Según la tabla, DDR3 opera entre 800 y 2133 MT/s."}]}, {"id": "09R", "title": "Raspberry Pi 3 y 4", "summary": ["La Raspberry Pi es una computadora de placa única (SBC) de la Raspberry Pi Foundation, lanzada en 2012 para fomentar el aprendizaje de la programación.", "Pi 3: SoC BCM2837, 4 núcleos Cortex-A53 a 1.2 GHz, L1 32 KB y L2 512 KB; Pi 4: SoC BCM2711, 4 núcleos Cortex-A72 a 1.5 GHz, L1 48 KB y L2 1 MB.", "ARMv8-A ofrece modos AArch64 (31 registros X0-X30 de 64 bits) y AArch32 (R0-R15 de 32 bits, compatible con ARMv7-A).", "ARM es RISC, de modelo load-store, con ejecución condicional basada en las banderas N, Z, C y V.", "GPIO se controla mediante registros mapeados en memoria: GPIO_BASE = PERIPHERAL_BASE + 0x200000 (0x3F200000 en Pi 3 y 0xFE200000 en Pi 4)."], "questions": [{"type": "mc", "q": "¿Qué SoC y núcleo utiliza la Raspberry Pi 3?", "options": ["BCM2711 con Cortex-A72", "BCM2837 con Cortex-A53", "BCM2835 con ARM11", "BCM2712 con Cortex-A76"], "answer": 1, "explanation": "La Raspberry Pi 3 usa el SoC Broadcom BCM2837 con cuatro núcleos ARM Cortex-A53 de 64 bits a 1.2 GHz."}, {"type": "mc", "q": "¿Cuál es el tamaño de la caché L2 compartida de la Raspberry Pi 4?", "options": ["512 KB", "48 KB", "1 MB", "2 MB"], "answer": 2, "explanation": "La Pi 4 (BCM2711) tiene una caché L2 compartida de 1 MB, frente a 512 KB en la Pi 3."}, {"type": "tf", "q": "La Raspberry Pi 3 fue el primer modelo con Wi-Fi y Bluetooth integrados.", "options": ["Verdadero", "Falso"], "answer": 0, "explanation": "Las diapositivas indican que la Pi 3 (2016) fue la primera Raspberry Pi con Wi-Fi y Bluetooth integrados."}, {"type": "mc", "q": "¿Cuántos registros de propósito general de 64 bits hay en modo AArch64?", "options": ["16 (R0-R15)", "32 (V0-V31)", "64", "31 (X0-X30)"], "answer": 3, "explanation": "En AArch64 existen 31 registros de propósito general de 64 bits, X0-X30; en AArch32 se usan 16 registros de 32 bits (R0-R15)."}, {"type": "mc", "q": "En ARMv8-A, ¿qué registro actúa como Link Register y guarda la dirección de retorno de subrutinas?", "options": ["X0", "X30", "XZR", "SP"], "answer": 1, "explanation": "El LR (Link Register) corresponde a X30 y guarda la dirección de retorno en llamadas a subrutinas."}, {"type": "mc", "q": "¿Para qué se usan los 32 registros vectoriales de 128 bits V0-V31?", "options": ["Para instrucciones NEON (SIMD) que operan en paralelo sobre múltiples datos", "Para almacenar las banderas de condición", "Para controlar la MMU", "Para guardar direcciones de retorno"], "answer": 0, "explanation": "Los registros V0-V31 de 128 bits sirven a las instrucciones NEON, que realizan operaciones en paralelo sobre múltiples datos."}, {"type": "tf", "q": "El modo AArch32 es el modo de compatibilidad de 32 bits que emula la arquitectura ARMv7-A.", "options": ["Verdadero", "Falso"], "answer": 0, "explanation": "AArch32 emula ARMv7-A, usa los registros R0-R15 y puede ejecutar instrucciones ARM de 32 bits o Thumb de 16/32 bits."}, {"type": "mc", "q": "¿Cuál es la principal ventaja del conjunto de instrucciones Thumb frente a ARM?", "options": ["Instrucciones más complejas por tener más bits", "Mayor densidad de código, reduciendo el tamaño de los programas hasta en un 30%", "Acceso a 64 registros adicionales", "Eliminación de la ejecución condicional"], "answer": 1, "explanation": "Thumb usa instrucciones de 16 bits (o 32 bits en Thumb-2) y mejora la densidad de código, reduciendo los programas hasta en un 30%."}, {"type": "mc", "q": "En el modelo load-store de ARM, ¿qué instrucción carga datos de memoria a un registro?", "options": ["STR", "MOV", "LDR", "BL"], "answer": 2, "explanation": "En el modelo load-store, LDR carga datos de memoria a registros y STR almacena de registros a memoria."}, {"type": "mc", "q": "¿Qué instrucción se usa para llamar a una subrutina guardando la dirección de retorno?", "options": ["B", "RET", "CMP", "BL"], "answer": 3, "explanation": "BL (branch with link) salta a la subrutina y guarda la dirección de retorno en el Link Register; RET/BX LR regresan."}, {"type": "mc", "q": "¿En qué se basa la ejecución condicional de instrucciones en ARM?", "options": ["En las banderas N, Z, C y V del registro de estado", "En el valor del registro X0", "En la dirección del PC", "En el contenido de la caché L1"], "answer": 0, "explanation": "Casi cualquier instrucción puede ejecutarse condicionalmente según las banderas N (negativo), Z (cero), C (acarreo) y V (desbordamiento)."}, {"type": "mc", "q": "Si la dirección base de periféricos de la Raspberry Pi 4 es 0xFE000000, ¿cuál es la dirección base de GPIO?", "options": ["0xFE000200", "0x3F200000", "0xFE200000", "0xFE020000"], "answer": 2, "explanation": "GPIO_BASE = PERIPHERAL_BASE + 0x200000, es decir, 0xFE000000 + 0x200000 = 0xFE200000."}, {"type": "mc", "q": "¿Qué registro GPIO se usa para poner un pin en \"0\"?", "options": ["GPSETn", "GPLEVn", "GPFSELn", "GPCLRn"], "answer": 3, "explanation": "GPCLRn (offset 0x28-0x2C) apaga el GPIO; GPSETn lo pone en 1, GPLEVn lee su estado y GPFSELn configura su modo."}, {"type": "tf", "q": "En el programa Hola Mundo para AArch64, la llamada al sistema se invoca con SVC #0 después de cargar su número en el registro x8.", "options": ["Verdadero", "Falso"], "answer": 0, "explanation": "El ejemplo carga el número de syscall en x8 (64 para write, 93 para exit) e invoca la llamada con svc #0."}, {"type": "mc", "q": "¿Qué herramienta combina varios archivos objeto en un ejecutable y resuelve referencias entre módulos?", "options": ["GNU Assembler (as)", "GDB", "GNU Linker (ld)", "QEMU"], "answer": 2, "explanation": "El GNU Linker (ld) combina archivos objeto en un ejecutable; as ensambla, GDB depura y QEMU emula."}]}, {"id": "10", "title": "Unidades de almacenamiento y sistemas de archivos", "summary": ["Las unidades de almacenamiento conforman la memoria secundaria; el HDD usa grabación magnética.", "Los fabricantes miden capacidad con potencias de 1000 y algunos sistemas operativos con potencias de 1024: 500 GB se ven como 465 GiB.", "Una partición montada se llama volumen; los esquemas de particiones más conocidos son MBR y GPT.", "MBR admite 4 particiones primarias o 3 primarias y una extendida; la extendida contiene hasta 32 particiones lógicas (Linux impone 15).", "La tabla de particiones MBR tiene 4 entradas de 16 bytes (bytes 446, 462, 478 y 494); el tipo de partición identifica el sistema de archivos (0x07 NTFS, 0x83 Linux)."], "questions": [{"type": "mc", "q": "¿Qué sistema de grabación emplea un disco duro (HDD)?", "options": ["Óptico", "Magnético", "Eléctrico por condensadores", "Flash NAND"], "answer": 1, "explanation": "El HDD es un dispositivo que emplea un sistema de grabación magnética para almacenar archivos digitales."}, {"type": "mc", "q": "Un disco duro de 500 GB se muestra en algunos sistemas operativos con una capacidad menor. ¿Cuál y por qué?", "options": ["450 GB, por el espacio de la tabla de particiones", "512 GiB, porque se usan potencias de 1024", "465 GiB, porque el sistema usa potencias de 1024 en lugar de 1000", "500 GiB, porque ambas unidades son equivalentes"], "answer": 2, "explanation": "Los fabricantes usan prefijos SI (potencias de 1000) y algunos sistemas operativos prefijos binarios (1024), por lo que 500 GB aparecen como 465 GiB."}, {"type": "tf", "q": "Una vez que una partición se ha montado, se le puede llamar volumen.", "options": ["Verdadero", "Falso"], "answer": 0, "explanation": "Las diapositivas definen que una partición, una vez montada, puede denominarse volumen."}, {"type": "mc", "q": "¿Cuáles son los dos esquemas de particiones más conocidos y difundidos?", "options": ["FAT y NTFS", "EXT4 y Btrfs", "UDF e ISO", "MBR y GPT"], "answer": 3, "explanation": "Los esquemas más conocidos son MBR (Master Boot Record) y GPT (GUID Partition Table); FAT, NTFS o EXT4 son sistemas de archivos."}, {"type": "mc", "q": "¿Qué combinación de particiones admite como máximo un disco con tabla MBR?", "options": ["4 primarias, o 3 primarias y 1 extendida", "8 primarias", "2 primarias y 2 extendidas", "1 primaria y hasta 32 extendidas"], "answer": 0, "explanation": "Solo puede haber 4 particiones primarias o 3 primarias y una extendida."}, {"type": "mc", "q": "¿Cuántas particiones lógicas puede haber como máximo en una partición extendida, y cuál es el límite que impone Linux?", "options": ["4 y 4", "15 y 32", "32 y 15", "64 y 32"], "answer": 2, "explanation": "Puede haber un máximo de 32 particiones lógicas en una partición extendida; Linux impone un máximo de 15."}, {"type": "tf", "q": "La partición extendida sirve para contener múltiples unidades lógicas en su interior.", "options": ["Verdadero", "Falso"], "answer": 0, "explanation": "La partición extendida (o secundaria) actúa como una primaria y sirve para contener múltiples unidades lógicas."}, {"type": "mc", "q": "¿Cuál es el tamaño de cada entrada de la tabla de particiones MBR?", "options": ["8 bytes", "32 bytes", "512 bytes", "16 bytes"], "answer": 3, "explanation": "Cada entrada de la tabla es de 16 bytes; las cuatro entradas comienzan en los bytes 446, 462, 478 y 494."}, {"type": "mc", "q": "¿En qué byte del MBR comienza la entrada de la partición 3?", "options": ["446", "478", "462", "494"], "answer": 1, "explanation": "Las entradas comienzan en 446 (P1), 462 (P2), 478 (P3) y 494 (P4), separadas 16 bytes entre sí."}, {"type": "mc", "q": "En una entrada de la tabla MBR, el byte de la posición 0 vale 80h. ¿Qué indica?", "options": ["Que la partición está activa", "Que la partición es de tipo Linux", "Que la partición no está activa", "Que la partición es extendida"], "answer": 0, "explanation": "El byte 0 es el estado de la partición: 00h no activa y 80h activa."}, {"type": "mc", "q": "¿Qué código de tipo de partición corresponde a Windows NT NTFS?", "options": ["0x0B", "0x83", "0x07", "0x06"], "answer": 2, "explanation": "La tabla de tipos asigna 0x07 a OS/2 IFS y Windows NT NTFS; 0x06 es FAT16, 0x0B FAT32 y 0x83 Linux."}, {"type": "tf", "q": "El código de tipo de partición 0x82 corresponde a Linux Swap.", "options": ["Verdadero", "Falso"], "answer": 0, "explanation": "Según la tabla de tipos, 0x82 es Linux Swap y 0x83 es Linux."}, {"type": "mc", "q": "¿Qué tipo de formato utilizan los discos ópticos como DVD y CD?", "options": ["NTFS", "FAT32", "GPT", "UDF (Universal Disc Format)"], "answer": 3, "explanation": "Los discos ópticos utilizan UDF, Universal Disc Format."}, {"type": "mc", "q": "¿Qué desventaja de las implementaciones más extendidas de FAT señalan las diapositivas?", "options": ["No es compatible con tarjetas de memoria", "Tiende a fragmentar los archivos, haciendo más lenta la lectura y escritura con el tiempo", "No permite entornos multiarranque", "Solo funciona en discos ópticos"], "answer": 1, "explanation": "Al borrar y escribir archivos, FAT tiende a dejar fragmentos dispersos, lo que vuelve cada vez más lentas la lectura y escritura."}]}, {"id": "10.1", "title": "Sistema de archivos FAT16", "summary": ["FAT16 apareció en 1987; con clusters de 32 KiB y sectores de 512 bytes su límite fue 2 GiB; Windows NT 4.0 y XP ampliaron el cluster a 64 KB, con particiones de hasta 4 GB.", "El Boot Sector define bytes por sector (byte 11), sectores por cluster (13), sectores reservados (14), copias de la FAT (16), entradas del Root Directory (17) y sectores por FAT (22).", "Sector inicial del Root Directory: SIRD = (Número de FATs x Sectores por FAT) + Sectores reservados.", "Sector inicial de un archivo o carpeta: SIA = (Número de FATs x Sectores por FAT) + Sectores reservados + (Primer cluster x Sectores por cluster).", "Cada entrada del Root Directory tiene nombre (8 bytes), extensión (3), atributo (0x0B), hora (0x16), fecha (0x18), primer cluster (0x1A) y tamaño (0x1C), en little-endian."], "questions": [{"type": "mc", "q": "En el Boot Sector, los bytes 11-12 contienen \"00 02\". ¿Qué valor representan?", "options": ["2 sectores por cluster", "512 bytes por sector", "2 copias de la FAT", "200 entradas en el Root Directory"], "answer": 1, "explanation": "Los bytes 11-12 son los bytes por sector; leídos en little-endian, 0200h = 512 bytes."}, {"type": "mc", "q": "El byte 13 del Boot Sector contiene 10h. ¿Qué significa?", "options": ["Cada cluster tiene 16 sectores", "Hay 10 sectores reservados", "Cada sector tiene 16 bytes", "Hay 16 copias de la FAT"], "answer": 0, "explanation": "El byte 13 indi
