ca los sectores por cluster: 10h = 16 sectores."}, {"type": "mc", "q": "Con 2 FATs de 242 sectores cada una y 4 sectores reservados, ¿en qué sector comienza el Root Directory?", "options": ["484", "246", "488", "492"], "answer": 2, "explanation": "SIRD = (2 x 242) + 4 = 488, como en el ejemplo de las diapositivas."}, {"type": "mc", "q": "Una partición FAT16 tiene 2 FATs de 200 sectores cada una y 1 sector reservado. ¿Cuál es el sector inicial del Root Directory?", "options": ["201", "400", "402", "401"], "answer": 3, "explanation": "SIRD = (Número de FATs x Sectores por FAT) + Sectores reservados = (2 x 200) + 1 = 401."}, {"type": "mc", "q": "Con 2 FATs de 242 sectores, 4 sectores reservados, 16 sectores por cluster y primer cluster del archivo igual a 100, ¿en qué sector se encuentra el archivo según la fórmula SIA de las diapositivas?", "options": ["2088", "1600", "2084", "1988"], "answer": 0, "explanation": "SIA = (2 x 242) + 4 + (100 x 16) = 488 + 1600 = 2088."}, {"type": "mc", "q": "En una entrada del Root Directory, el campo del primer cluster (offset 0x1A) contiene los bytes \"22 51\". ¿Qué cluster indica?", "options": ["8785 (2251h)", "20770 (5122h)", "34", "81"], "answer": 1, "explanation": "Se almacena primero el byte menos significativo; ordenado queda 5122h = 20770."}, {"type": "mc", "q": "El campo de tamaño del archivo (offset 0x1C) contiene \"42 00 00 00\". ¿Cuál es el tamaño del archivo?", "options": ["42 bytes", "1107296256 bytes", "4200 bytes", "66 bytes"], "answer": 3, "explanation": "Ordenado del byte más significativo al menos significativo queda 00000042h, que equivale a 66 bytes en decimal."}, {"type": "mc", "q": "¿Qué valor del byte de atributo (offset 0x0B) indica que la entrada corresponde a una carpeta?", "options": ["0x20", "0x02", "0x10", "0x0F"], "answer": 2, "explanation": "0x10 indica carpeta; 0x20 archivo de trabajo, 0x02 oculto y 0x0F nombre largo de archivo (LFN)."}, {"type": "tf", "q": "En el campo de nombre del Root Directory se almacena el punto que separa el nombre de la extensión.", "options": ["Verdadero", "Falso"], "answer": 1, "explanation": "El nombre ocupa 8 bytes y la extensión 3 bytes; no se incluye el punto separador."}, {"type": "mc", "q": "El campo de fecha tiene el formato yyyyyyymmmmddddd y su valor es 4D45h (0100110 1010 00101). ¿Qué fecha representa?", "options": ["5 de octubre de 2018", "10 de mayo de 2018", "5 de octubre de 1938", "5 de octubre de 2038"], "answer": 0, "explanation": "Año 0100110 = 38, que se suma a 1980 (2018); mes 1010 = 10 (octubre); día 00101 = 5."}, {"type": "mc", "q": "En el campo de hora con formato hhhhhmmmmmmsssss y valor 0100110101000101b, ¿qué hora y minuto se obtienen?", "options": ["10:42", "9:21", "5:42", "9:42"], "answer": 3, "explanation": "Hora 01001 = 9 y minuto 101010 = 42, según la decodificación de las diapositivas."}, {"type": "mc", "q": "¿Qué representa el campo del byte 17 del Boot Sector, con valor 0200h = 512?", "options": ["El número máximo de archivos y carpetas que pueden escribirse en el Root Directory", "Los sectores ocupados por cada FAT", "Los bytes por cluster", "El número de sectores reservados"], "answer": 0, "explanation": "Los bytes 17-18 indican el número de entradas del Root Directory: puede contener 512 archivos y carpetas."}, {"type": "mc", "q": "Según las diapositivas, ¿qué cambio introdujeron Windows NT 4.0 y Windows XP en FAT16?", "options": ["Redujeron el cluster a 512 bytes", "Eliminaron la segunda copia de la FAT", "Aumentaron el tamaño máximo del cluster a 64 KB, permitiendo particiones de hasta 4 GB", "Introdujeron nombres de archivo de 16 caracteres"], "answer": 2, "explanation": "Windows NT 4.0 (1998) y Windows XP (2001) aumentaron el tamaño máximo del cluster a 64 kilobytes, con particiones de hasta 4 GB."}, {"type": "tf", "q": "Según la nota de las diapositivas, si la partición tiene un tamaño menor a 256 megas se deben sumar 2 clusters al cluster inicial del archivo.", "options": ["Verdadero", "Falso"], "answer": 0, "explanation": "La nota indica que en particiones menores a 256 megas se suman 2 clusters al cluster inicial del archivo."}]}, {"id": "11", "title": "Discos de estado sólido", "summary": ["Los SSD usan memoria flash NAND no volátil, sin partes móviles, con tiempos de acceso inferiores a 0,1 ms frente a 5-10 ms de los HDD.", "Componentes: controlador (cerebro), caché DRAM (tabla de mapeo), chips NAND en canales paralelos e interfaz (SATA, PCIe, M.2).", "Tipos de celda: SLC (1 bit), MLC (2), TLC (3) y QLC (4); más bits por celda implica más capacidad pero menos velocidad y ciclos P/E.", "SATA III llega a unos 550-600 MB/s; PCIe/NVMe alcanza velocidades hasta 12 veces superiores y latencias de unos 0,02 ms.", "FTL, escritura out-of-place, garbage collection, wear leveling, TRIM y overprovisioning gestionan las limitaciones de la flash.", "Durabilidad se mide con TBW, DWPD y MTBF; la seguridad usa cifrado por hardware (AES-256, TCG Opal 2.0) y Secure Erase/Sanitize."], "questions": [{"type": "mc", "q": "¿Qué función cumple la memoria caché DRAM en un SSD, según las diapositivas?", "options": ["Almacenar de forma permanente los datos del usuario cuando no hay energía", "Actuar como buffer temporal y almacenar la tabla de asignación de direcciones lógicas a físicas", "Ejecutar los algoritmos de corrección de errores BCH y LDPC", "Proporcionar la conexión física con la placa base"], "answer": 1, "explanation": "La caché DRAM actúa como buffer temporal y almacena la tabla de asignación para mapear direcciones lógicas a físicas, mejorando el rendimiento."}, {"type": "mc", "q": "¿Cuántos ciclos P/E aproximados se indican para la memoria SLC en la tabla comparativa?", "options": ["500-1.000 ciclos", "1.000-3.000 ciclos", "3.000-10.000 ciclos", "100.000 ciclos"], "answer": 3, "explanation": "La tabla indica 100.000 ciclos para SLC, que ofrece la máxima durabilidad a un costo por GB muy alto."}, {"type": "tf", "q": "Los SSD domésticos y comerciales suelen utilizar memoria TLC por ofrecer un equilibrio aceptable entre precio y rendimiento.", "options": ["Verdadero", "Falso"], "answer": 0, "explanation": "Las diapositivas señalan que SLC se reserva para aplicaciones empresariales críticas y que los SSD domésticos suelen usar TLC."}, {"type": "mc", "q": "¿En qué consiste el denominado caché SLC?", "options": ["Un chip DRAM dedicado exclusivamente a guardar datos SLC", "Una porción de celdas TLC que opera temporalmente en modo SLC para ofrecer ráfagas de alto rendimiento", "Un área de la RAM del sistema usada por SSD sin DRAM", "Una reserva de espacio no accesible para el sistema operativo"], "answer": 1, "explanation": "El caché SLC hace que una porción de las celdas TLC opere temporalmente en modo SLC para obtener ráfagas de alto rendimiento."}, {"type": "mc", "q": "¿Qué velocidad real aproximada alcanza una interfaz SATA III de 6 Gbps debido a la sobrecarga del protocolo?", "options": ["550-600 MB/s", "985 MB/s", "3,5 GB/s", "7,0 GB/s"], "answer": 0, "explanation": "SATA III tiene 6 Gbps teóricos, traducidos a aproximadamente 550-600 MB/s reales por la sobrecarga del protocolo."}, {"type": "mc", "q": "¿Qué ventaja tiene NVMe frente a AHCI, el protocolo usado en SATA?", "options": ["Mayor compatibilidad con equipos de la última década", "Uso de conectores de 2,5 pulgadas idénticos a los discos portátiles", "Reduce drásticamente la sobrecarga, permitiendo millones de IOPS y menores latencias", "Elimina la necesidad de un controlador en el SSD"], "answer": 2, "explanation": "NVMe está optimizado para SSD, aprovecha el paralelismo y la baja latencia de la flash y reduce drásticamente la sobrecarga frente a AHCI."}, {"type": "tf", "q": "Según las diapositivas, la latencia de SATA es de aproximadamente 0,02 ms y la de NVMe de aproximadamente 0,2 ms.", "options": ["Verdadero", "Falso"], "answer": 1, "explanation": "Es al revés: SATA ofrece latencias de aproximadamente 0,2 ms y NVMe puede reducirlas hasta 0,02 ms."}, {"type": "mc", "q": "¿Qué es el FTL (Flash Translation Layer)?", "options": ["Un sistema de archivos optimizado para SSD de Apple", "Un comando ATA para informar de datos eliminados", "Un protocolo de comunicación sobre PCIe", "La capa de traducción entre direcciones lógicas y físicas que abstrae la ubicación de los datos"], "answer": 3, "explanation": "El FTL traduce direcciones lógicas a físicas y permite que el sistema operativo vea el SSD como un dispositivo de bloques tradicional."}, {"type": "mc", "q": "En un SSD, ¿a qué nivel ocurren las escrituras y borrados según la diapositiva de organización de datos?", "options": ["A nivel de celda individual", "A nivel de bloque completo", "A nivel de sector de 512 bytes", "A nivel de byte"], "answer": 1, "explanation": "Las lecturas ocurren a nivel de página, pero las escrituras y borrados suceden a nivel de bloque completo."}, {"type": "mc", "q": "¿Qué técnica distribuye las escrituras uniformemente entre todas las celdas para evitar el desgaste prematuro?", "options": ["Garbage Collection", "Overprovisioning", "Wear Leveling", "TRIM"], "answer": 2, "explanation": "El wear leveling distribuye las escrituras uniformemente entre todas las celdas, extendiendo la vida útil del dispositivo."}, {"type": "mc", "q": "¿Qué ocurre si un SSD no recibe comandos TRIM?", "options": ["Continúa preservando datos que el sistema operativo ya considera eliminados, degradando el rendimiento con el tiempo", "Borra inmediatamente todos los bloques con datos válidos", "Deja de aplicar corrección de errores ECC", "Pierde la tabla de mapeo almacenada en la DRAM"], "answer": 0, "explanation": "Sin TRIM, el SSD sigue preservando datos eliminados, reduciendo el espacio disponible para escrituras y provocando degradación del rendimiento."}, {"type": "tf", "q": "El overprovisioning viene preconfigurado de fábrica, generalmente entre el 7 y el 10% del espacio, y los SSD empresariales suelen reservar un 20-25%.", "options": ["Verdadero", "Falso"], "answer": 0, "explanation": "Las diapositivas indican un 7-10% de fábrica y un mayor porcentaje reservado (20-25%) en SSD empresariales."}, {"type": "mc", "q": "¿Qué tecnología permite a un SSD sin DRAM usar parte de la RAM del sistema como caché?", "options": ["SLC Caching", "HMB (Host Memory Buffer)", "Caché Adaptativa", "TCG Opal 2.0"], "answer": 1, "explanation": "HMB permite a SSD sin DRAM usar parte de la RAM del sistema, reduce costo y requiere soporte del sistema operativo."}, {"type": "mc", "q": "¿Qué indica la métrica DWPD (Drive Writes Per Day)?", "options": ["Los terabytes totales que pueden escribirse durante toda la vida útil", "El tiempo medio entre fallos en horas", "El número de ciclos P/E por celda", "Cuántas veces puede reescribirse la capacidad total del SSD diariamente durante la garantía"], "answer": 3, "explanation": "DWPD indica cuántas veces puede reescribirse la capacidad total del SSD cada día durante el período de garantía."}, {"type": "mc", "q": "¿Cómo funciona el comando Secure Erase descrito en las diapositivas?", "options": ["Reescribe físicamente todas las celdas del SSD", "Envía comandos TRIM para todas las páginas", "Cambia la clave de cifrado, haciendo inaccesibles instantáneamente los datos previos", "Formatea la partición con un sistema de archivos nuevo"], "answer": 2, "explanation": "Secure Erase cambia la clave de cifrado haciendo inaccesibles los datos previos; Sanitize es el que reescribe físicamente las celdas."}]}, {"id": "11.1", "title": "Discos de estado sólido: estructura y funcionamiento", "summary": ["Un SSD no tiene partes móviles y usa flash NAND, con velocidades hasta 10-20 veces superiores a los HDD.", "La celda NAND atrapa electrones en un aislante: con electrones se interpreta 0, vacía se interpreta 1.", "Jerarquía: celdas, páginas (4-16 KB, unidad mínima de escritura), bloques (128-512 páginas, unidad mínima de borrado), planos y matrices.", "Un ciclo P/E es una escritura más un borrado; al escribir, el controlador copia el bloque, marca el original como basura y actualiza los mapas.", "Wear leveling dinámico o estático, garbage collection, ECC y traducción de direcciones son funciones del controlador y firmware.", "Frente al HDD: acceso de 0,1-0,2 ms, 10.000-1.000.000 IOPS; limitaciones: ciclos finitos, degradación al llenarse más del 80-90% y mayor costo por GB."], "questions": [{"type": "mc", "q": "¿Cómo interpreta un chip NAND el estado de una celda según las diapositivas?", "options": ["Con electrones atrapados se interpreta como 1 y vacía como 0", "Con electrones atrapados se interpreta como 0 y vacía como 1", "Con carga magnética positiva se interpreta como 1", "El valor depende de la orientación del cabezal de lectura"], "answer": 1, "explanation": "Si hay electrones atrapados el chip lo interpreta como 0; si la celda está vacía, como 1."}, {"type": "mc", "q": "En la breve historia del SSD, ¿qué ocurrió en los años 1980-1990?", "options": ["Uso de memorias de núcleo magnético y tambores magnéticos", "Popularización masiva de los SSD en el mercado consumer", "Aparición de NVMe y del factor de forma M.2", "Desarrollo de las primeras memorias flash e introducción por Intel de la primera memoria flash comercial"], "answer": 3, "explanation": "En 1980-1990 se desarrollaron las primeras memorias flash e Intel introdujo la primera memoria flash comercial."}, {"type": "tf", "q": "La carcasa metálica de un SSD solo cumple la función de proteger físicamente los componentes internos.", "options": ["Verdadero", "Falso"], "answer": 1, "explanation": "Además de proteger, la carcasa actúa como disipador de calor, crucial para mantener el rendimiento y la vida útil."}, {"type": "mc", "q": "En la jerarquía lógica de almacenamiento de un SSD, ¿cuál es la unidad mínima de escritura y cuál la de borrado?", "options": ["Escritura: página; borrado: bloque", "Escritura: celda; borrado: página", "Escritura: bloque; borrado: página", "Escritura: bloque; borrado: plano"], "answer": 0, "explanation": "Las páginas son la unidad mínima de escritura y los bloques la unidad mínima de borrado."}, {"type": "mc", "q": "Según la diapositiva de estructura lógica, ¿cuántas páginas contiene típicamente un bloque?", "options": ["4-16 páginas", "32-64 páginas", "128-512 páginas", "1.024-4.096 páginas"], "answer": 2, "explanation": "La jerarquía indica páginas de 4-16 KB y bloques de 128-512 páginas."}, {"type": "mc", "q": "En la analogía del archivador, ¿a qué corresponden los bloques?", "options": ["Al archivador completo", "A los cajones grandes", "A las hojas", "A las carpetas"], "answer": 3, "explanation": "La analogía es: chip = archivador, DIE = cajones, bloques = carpetas, páginas = hojas, celdas = espacios para bits."}, {"type": "mc", "q": "¿Qué se considera un ciclo P/E (Program Erase Cycle)?", "options": ["Una escritura de datos más un borrado de datos", "Una lectura de página completa", "Una ejecución completa de garbage collection", "Un encendido y apagado del dispositivo"], "answer": 0, "explanation": "Una escritura de datos más un borrado de datos se cuenta como 1 ciclo P/E."}, {"type": "mc", "q": "En el proceso de escritura de un SSD, ¿qué hace el controlador después de copiar el bloque con las modificaciones a un área libre?", "options": ["Sobrescribe directamente la página original", "Marca el bloque original como basura para borrarlo en la siguiente recolección", "Envía un comando TRIM al sistema operativo", "Desactiva el wear leveling"], "answer": 1, "explanation": "Tras la copia, el bloque original se marca como basura y luego se actualizan las tablas de traducción de direcciones."}, {"type": "tf", "q": "El proceso de escritura explica por qué los SSD necesitan over-provisioning y por qué su rendimiento puede degradarse cuando el disco está muy lleno.", "options": ["Verdadero", "Falso"], "answer": 0, "explanation": "La diapositiva del proceso de escritura concluye exactamente eso, ya que se necesita espacio libre para copiar bloques."}, {"type": "mc", "q": "¿Qué diferencia a la nivelación de desgaste estática de la dinámica?", "options": ["La estática solo considera bloques con datos cambiantes", "La estática se ejecuta únicamente en SSD SATA", "La estática también mueve datos raramente modificados", "La estática desactiva la corrección de errores"], "answer": 2, "explanation": "La dinámica solo considera bloques con datos cambiantes; la estática también mueve datos raramente modificados."}, {"type": "mc", "q": "¿Qué tiempo de acceso se indica para un SSD frente a los 3-15 ms de búsqueda de un HDD?", "options": ["2-8 ms", "0,1-0,2 ms", "1-3 ms", "0,001 ms"], "answer": 1, "explanation": "El SSD tiene un tiempo de acceso de 0,1-0,2 ms, aproximadamente 100 veces más rápido."}, {"type": "tf", "q": "Los SSD presentan al sistema operativo la misma interfaz de sectores lineales que un HDD, lo que permite reemplazar HDD sin modificar el software.", "options": ["Verdadero", "Falso"], "answer": 0, "explanation": "Aunque internamente usan páginas y bloques, los SSD presentan una interfaz de sectores lineales compatible con los sistemas existentes."}, {"type": "mc", "q": "¿A partir de qué nivel de ocupación puede degradarse notablemente el rendimiento de un SSD según las diapositivas?", "options": ["Más del 30-40%", "Más del 50-60%", "Más del 80-90%", "Solo al 100%"], "answer": 2, "explanation": "Al llenarse más del 80-90% el rendimiento se degrada; se recomienda mantener al menos 10-20% libre."}, {"type": "mc", "q": "¿Por qué la recuperación de datos de un SSD fallido puede ser más compleja que en un HDD?", "options": ["Por la presencia de platos magnéticos frágiles", "Porque el SSD no usa tabla de mapeo", "Porque los SSD no admiten interfaces estándar", "Por la distribución de los datos y los algoritmos de encriptación de los controladores"], "answer": 3, "explanation": "Las diapositivas atribuyen la dificultad a la distribución de datos y a la encriptación que implementan muchos controladores."}]}, {"id": "12", "title": "Dispositivos de entrada y salida", "summary": ["Un periférico es un dispositivo de hardware que comunica la computadora con el exterior o almacena información como memoria auxiliar.", "Un bus transfiere datos, direcciones y señales de control; puede ser paralelo o serie y reduce conexiones dedicadas.", "Bus de direcciones: unidireccional desde la CPU; bus de datos: bidireccional; bus de control: señales como RD, WR e IRQ.", "Con mapeo de memoria, cada periférico recibe direcciones y la CPU usa los tres buses para leer o escribir.", "Polling: la CPU consulta periódicamente; interrupciones: el periférico avisa a la CPU cuando requiere servicio."], "questions": [{"type": "mc", "q": "¿Cuál de los siguientes es un periférico de salida según las diapositivas?", "options": ["Escáner", "Micrófono", "Lector de códigos de barras", "Impresora"], "answer": 3, "explanation": "Los periféricos de salida listados son pantalla, impresora y parlantes; los demás son de entrada."}, {"type": "tf", "q": "En la transmisión en serie de un bus se envían varios bits simultáneamente.", "options": ["Verdadero", "Falso"], "answer": 1, "explanation": "La transmisión en paralelo envía varios bits simultáneos; la serie envía bits secuenciales uno tras otro."}, {"type": "mc", "q": "¿Cuál de los siguientes NO se presenta como beneficio clave del sistema de buses?", "options": ["Reducción de conexiones", "Comunicación centralizada", "Eliminación de la necesidad de una CPU", "Compartición de recursos"], "answer": 2, "explanation": "Los beneficios citados son reducción de conexiones, comunicación centralizada y compartición de recursos."}, {"type": "mc", "q": "¿Qué característica tiene el bus de direcciones?", "options": ["Es unidireccional, desde la CPU hacia el dispositivo destino", "Es bidireccional entre CPU y memoria", "Transporta las señales RD y WR", "Transporta los datos binarios reales"], "answer": 0, "explanation": "El bus de direcciones es unidireccional y solo la CPU puede colocar señales en él para seleccionar el destino."}, {"type": "mc", "q": "¿Cuánta memoria puede direccionar un bus de direcciones de 20 líneas?", "options": ["64 KB", "1 MB", "16 MB", "4 GB"], "answer": 1, "explanation": "2^20 = 1.048.576 direcciones únicas, es decir, hasta 1 MB de memoria."}, {"type": "tf", "q": "El número de líneas del bus de datos (8, 16, 32, 64 bits) determina cuántos datos se pueden transferir simultáneamente.", "options": ["Verdadero", "Falso"], "answer": 0, "explanation": "El ancho del bus de datos determina la cantidad transferida simultáneamente e impacta el rendimiento."}, {"type": "mc", "q": "¿Qué señal del bus de control corresponde a una solicitud de interrupción?", "options": ["RD", "WR", "ACK", "IRQ"], "answer": 3, "explanation": "Las señales de ejemplo son RD (lectura), WR (escritura) e IRQ (Interrupt Request)."}, {"type": "mc", "q": "¿Cuál de las siguientes NO es una función crítica del bus de control según las diapositivas?", "options": ["Indicación de operaciones", "Control de acceso al bus", "Sincronización", "Almacenamiento de las direcciones de memoria"], "answer": 3, "explanation": "Las funciones críticas del bus de control son indicación de operaciones, control de acceso y sincronización."}, {"type": "mc", "q": "¿Cómo se denomina la técnica en la que cada periférico recibe direcciones específicas en el espacio de memoria?", "options": ["Polling", "Mapeo de memoria", "Wear leveling", "Cascada de interrupciones"], "answer": 1, "explanation": "La asignación de direcciones a periféricos en el espacio de memoria se conoce como mapeo de memoria."}, {"type": "mc", "q": "En el ejemplo de lectura de un teclado, ¿qué hace la CPU después de colocar la dirección del controlador de teclado en el bus de direcciones?", "options": ["Envía la señal RD por el bus de control", "Transmite el código ASCII de la tecla", "Envía la señal WR por el bus de datos", "Deshabilita todas las interrupciones"], "answer": 0, "explanation": "Tras el direccionamiento, la CPU envía la señal RD por el bus de control; luego el teclado transmite el código ASCII."}, {"type": "mc", "q": "¿Para qué tipo de periféricos se recomienda el polling?", "options": ["Periféricos muy rápidos con gran volumen de datos", "Discos de estado sólido NVMe", "Periféricos lentos o con actividad poco frecuente, como sensores de temperatura", "Tarjetas de red de alta velocidad"], "answer": 2, "explanation": "El uso recomendado del polling es para periféricos lentos o con actividad poco frecuente."}, {"type": "tf", "q": "Una desventaja del polling es que consume tiempo valioso de CPU y desperdicia recursos cuando no hay actividad.", "options": ["Verdadero", "Falso"], "answer": 0, "explanation": "Entre las desventajas del polling se citan el consumo de tiempo de CPU y el desperdicio de recursos sin actividad."}, {"type": "mc", "q": "En la secuencia de atención de interrupciones, ¿qué paso sigue a salvar el estado de la CPU y pedir la rutina de servicio?", "options": ["Restaurar el estado de la CPU", "Deshabilitar todas las interrupciones", "Identificar la causa de la interrupción", "Regresar de la rutina de servicio"], "answer": 1, "explanation": "El paso 2 es deshabilitar todas las interrupciones, antes de salvar información mínima en la pila."}]}, {"id": "12.1", "title": "Interrupciones (IRQ) en sistemas Windows", "summary": ["Una IRQ (Interrupt Request) es una señal de un dispositivo hardware para captar la atención inmediata del procesador.", "Flujo: dispositivo, línea IRQ, controlador de interrupciones (prioriza) y CPU, que ejecuta la ISR y restaura el contexto.", "La ISR guarda el estado, identifica el dispositivo, ejecuta la tarea y restaura el control.", "Tabla estándar: IRQ 0 temporizador, 1 teclado, 8 RTC, 12 ratón PS/2, 14 y 15 IDE.", "PIC: dos 8259A en cascada, hasta 15 IRQ y prioridades fijas; APIC: más de 240 interrupciones, apto para multiprocesador.", "Conflictos de IRQ se resuelven reasignando, con Plug and Play o reconfigurando; las NMI tienen prioridad máxima."], "questions": [{"type": "mc", "q": "¿Qué significa IRQ?", "options": ["Internal Register Queue", "Input Read Request", "Interrupt Request", "Interrupt Return Quick"], "answer": 2, "explanation": "IRQ significa Interrupt Request (Solicitud de Interrupción)."}, {"type": "tf", "q": "Sin IRQ, el procesador tendría que revisar constantemente cada dispositivo mediante polling, desperdiciando ciclos de CPU.", "options": ["Verdadero", "Falso"], "answer": 0, "explanation": "Las diapositivas señalan que sin IRQ se recurriría al polling, perdiendo eficiencia computacional."}, {"type": "mc", "q": "¿Qué componente recibe la señal IRQ y evalúa, según prioridades, si el CPU debe atenderla?", "options": ["El bus de datos", "El controlador de interrupciones", "La memoria caché", "El Administrador de dispositivos"], "answer": 1, "explanation": "El controlador de interrupciones recibe la señal y evalúa si el CPU debe atenderla según prioridades y estado del sistema."}, {"type": "mc", "q": "¿Cuál de las siguientes es una función de la ISR según las diapositivas?", "options": ["Asignar direcciones de memoria a los periféricos", "Generar la señal eléctrica en la línea IRQ", "Determinar qué dispositivo generó la interrupción mediante consultas al controlador", "Duplicar el ancho de banda del bus"], "answer": 2, "explanation": "La ISR guarda el estado, identifica el dispositivo consultando al controlador, ejecuta la tarea y restaura el control."}, {"type": "mc", "q": "En la tabla de asignación estándar, ¿qué dispositivo usa la IRQ 1?", "options": ["Temporizador del sistema", "Controlador de teclado", "Ratón PS/2", "Reloj en tiempo real"], "answer": 1, "explanation": "La IRQ 1 corresponde al controlador de teclado; la IRQ 0 al temporizador del sistema."}, {"type": "mc", "q": "¿Qué IRQ está asignada al ratón PS/2 en la tabla estándar?", "options": ["IRQ 3", "IRQ 7", "IRQ 12", "IRQ 14"], "answer": 2, "explanation": "La tabla asigna la IRQ 12 al puerto de ratón PS/2."}, {"type": "tf", "q": "En la tabla estándar, las IRQ 10 y 11 están reservadas para el controlador IDE primario.", "options": ["Verdadero", "Falso"], "answer": 1, "explanation": "Las IRQ 10-11 están disponibles para dispositivos PCI/USB; el IDE primario usa la IRQ 14."}, {"type": "mc", "q": "¿Cómo se visualizan las IRQ en el Administrador de dispositivos de Windows?", "options": ["Menú Ver, opción Recursos por tipo, y expandir Solicitud de interrupción (IRQ)", "Menú Archivo, opción Exportar IRQ", "Panel de Control, Redes, Propiedades del adaptador", "Menú Ver, opción Dispositivos ocultos únicamente"], "answer": 0, "explanation": "Se selecciona Recursos por tipo en el menú Ver y se expande Solicitud de interrupción (IRQ)."}, {"type": "mc", "q": "¿Cuál es el ejemplo clásico de conflicto de IRQ citado en las diapositivas?", "options": ["Teclado y temporizador compartiendo IRQ 0", "Ratón serial y módem interno compartiendo IRQ 3", "Disquetera y tarjeta de sonido compartiendo IRQ 6", "Dos controladores IDE compartiendo IRQ 14"], "answer": 1, "explanation": "El ejemplo clásico es un ratón serial y un módem interno compartiendo la IRQ 3, con comportamiento errático."}, {"type": "mc", "q": "¿Qué caracteriza al controlador PIC clásico?", "options": ["Gestiona más de 240 interrupciones con prioridades dinámicas", "Está diseñado para sistemas multiprocesador", "Usa dos chips 8259A en cascada, gestiona hasta 15 IRQ y tiene prioridades fijas", "No admite configuración en cascada"], "answer": 2, "explanation": "El PIC usa dos 8259A en cascada (8 IRQ por chip), gestiona hasta 15 IRQ con prioridades fijas basadas en el número IRQ."}, {"type": "tf", "q": "El APIC permite gestionar más de 240 interrupciones y es esencial para sistemas multiprocesador.", "options": ["Verdadero", "Falso"], "answer": 0, "explanation": "El APIC gestiona más de 240 interrupciones con distribución de carga y prioridades dinámicas, esencial en multiprocesador."}, {"type": "mc", "q": "¿Qué son las interrupciones no enmascarables (NMI)?", "options": ["Interrupciones de mínima prioridad que pueden posponerse", "Interrupciones generadas solo por software", "Interrupciones que solo existen en el PIC 8259A", "Interrupciones de máxima prioridad absoluta que no pueden ser ignoradas, usadas para errores críticos"], "answer": 3, "explanation": "Las NMI tienen máxima prioridad, no pueden ignorarse y se usan para errores críticos como fallos de memoria o de alimentación."}, {"type": "mc", "q": "¿Qué son las interrupciones anidadas?", "options": ["Una ISR interrumpida por otra interrupción de mayor prioridad", "Dos dispositivos que comparten la misma línea IRQ", "Interrupciones agrupadas en cascada entre IRQ 2 e IRQ 9", "Interrupciones que se atienden por polling"], "answer": 0, "explanation": "Una ISR puede ser interrumpida por otra de mayor prioridad, formando interrupciones anidadas."}, {"type": "mc", "q": "En el proceso de atención de interrupciones, ¿qué hace la ISR al terminar antes de que el CPU restaure el contexto?", "options": ["Reinicia el controlador de teclado", "Notifica al controlador de interrupciones que ha terminado, liberando la línea IRQ", "Reasigna su IRQ mediante Plug and Play", "Deshabilita permanentemente la línea IRQ"], "answer": 1, "explanation": "La ISR informa al controlador que ha terminado, liberando la línea IRQ para futuras interrupciones."}]}, {"id": "13", "title": "Protocolo I2C", "summary": ["I2C fue creado por Philips (NXP) en 1982 para comunicar circuitos integrados.", "Bus serie síncrono, semibidireccional, multipunto y multimaestro (no simultáneo).", "Líneas SCL (reloj, generado por el maestro), SDA (datos) y GND; requieren pull-up por drenaje abierto.", "Velocidades: Estándar 100 Kbps, Rápido 400 Kbps, Alta Velocidad 3.4 Mbps; capacitancia máxima 400 pF.", "START: SDA alto a bajo con SCL alto; STOP: SDA bajo a alto con SCL alto; ACK tras cada byte.", "Direccionamiento de 7 o 10 bits con bit R/W (0 escritura, 1 lectura)."], "questions": [{"type": "mc", "q": "¿Qué empresa desarrolló el protocolo I2C y en qué año se publicó su primera especificación?", "options": ["Motorola, 1985", "Intel, 1994", "Philips Semiconductors (hoy NXP), 1982", "IBM, 1980"], "answer": 2, "explanation": "I2C fue desarrollado por Philips Semiconductors (ahora NXP) y su primera especificación se publicó en 1982."}, {"type": "mc", "q": "¿Cuál es la finalidad principal del protocolo I2C según su diseño original?", "options": ["Conectar periféricos externos a un PC", "Comunicar circuitos integrados dentro de un mismo dispositivo", "Transmitir datos a larga distancia entre equipos", "Sustituir los puertos paralelos de impresora"], "answer": 1, "explanation": "I2C se diseñó para facilitar la comunicación entre circuitos integrados dentro de un mismo dispositivo, reduciendo la complejidad de interconexión."}, {"type": "mc", "q": "¿Qué tipo de bus y de enlace define a I2C?", "options": ["Serie síncrono, semibidireccional", "Serie asíncrono, bidireccional full duplex", "Paralelo síncrono, unidireccional", "Serie asíncrono, semibidireccional"], "answer": 0, "explanation": "I2C es un bus serie síncrono con enlace semibidireccional (no transmite en ambos sentidos a la vez)."}, {"type": "mc", "q": "¿Cuál de las siguientes velocidades NO corresponde a un modo de I2C mencionado en las diapositivas?", "options": ["Estándar: 100 Kbps", "Rápido: 400 Kbps", "Alta velocidad (Hs): 3.4 Mbps", "Super rápido: 12 Mbps"], "answer": 3, "explanation": "Los modos de I2C son Estándar 100 Kbps, Rápido 400 Kbps y Alta Velocidad 3.4 Mbps; 12 Mbps corresponde a USB Full Speed."}, {"type": "mc", "q": "¿Qué factor limita la cantidad de dispositivos que se pueden conectar a un bus I2C?", "options": ["El número de líneas CS disponibles en el maestro", "La impedancia capacitiva del bus, que no puede superar 400 pF", "El límite de 127 direcciones de 7 bits asignadas por el host", "La longitud máxima del cable de 5 metros"], "answer": 1, "explanation": "La cantidad de dispositivos en I2C está limitada porque la impedancia capacitiva no puede superar 400 pF."}, {"type": "mc", "q": "¿Cuál es la función de la línea SCL en I2C y quién la genera?", "options": ["Transporta los datos y la genera el esclavo", "Es la línea de referencia y no la genera ningún dispositivo", "Es la línea de reloj para sincronización y la genera el maestro", "Selecciona el esclavo y la generan ambos dispositivos"], "answer": 2, "explanation": "SCL es la línea de reloj para sincronización y es generada por el maestro; el esclavo es incapaz de generarla."}, {"type": "tf", "q": "En I2C, la línea SDA puede ser manipulada tanto por el maestro como por el esclavo.", "options": ["Verdadero", "Falso"], "answer": 0, "explanation": "Según las diapositivas, la señal SDA es manipulada por el maestro o el esclavo y por ella se envía la información."}, {"type": "mc", "q": "¿Por qué son necesarias las resistencias de pull-up (10K-47K) en el bus I2C?", "options": ["Para limitar la velocidad del bus a 100 Kbps", "Porque las líneas trabajan en modo de drenaje abierto y se requiere generar el nivel alto", "Para eliminar la necesidad de la línea GND", "Para que el esclavo pueda generar la señal de reloj"], "answer": 1, "explanation": "Las líneas trabajan en modo de drenaje abierto, por lo que se necesitan resistencias de pull-up para generar el nivel alto."}, {"type": "mc", "q": "¿Cómo se produce la condición de inicio (START) en I2C?", "options": ["SDA pasa de bajo a alto mientras SCL está en alto", "SCL pasa de alto a bajo mientras SDA está en bajo", "SDA cambia de estado mientras SCL está en bajo", "SDA pasa de alto a bajo mientras SCL permanece en alto"], "answer": 3, "explanation": "El START consiste en una transición de SDA de alto a bajo mientras SCL permanece en alto."}, {"type": "tf", "q": "En I2C, la condición de parada (STOP) se genera con una transición de SDA de alto a bajo mientras SCL está en alto.", "options": ["Verdadero", "Falso"], "answer": 1, "explanation": "El STOP es una transición de SDA de bajo a alto con SCL en alto; la transición de alto a bajo corresponde al START."}, {"type": "mc", "q": "Durante la transferencia de datos en I2C, ¿en qué momento se considera válido el dato presente en SDA?", "options": ["En la fase alta de SCL, sin que SDA pueda cambiar", "En la fase baja de SCL, cuando SDA cambia", "En cualquier momento, ya que el bus es asíncrono", "Solo en el flanco de bajada de SDA"], "answer": 0, "explanation": "El dato es válido en la fase alta de SCL y no se admite que SDA cambie; SDA solo puede cambiar con SCL en bajo."}, {"type": "mc", "q": "¿Qué ocurre después de cada byte transmitido en I2C?", "options": ["El maestro genera una condición de STOP", "El receptor envía un bit de reconocimiento (ACK)", "El esclavo genera un pulso en SCL", "Se transmite un bit de paridad"], "answer": 1, "explanation": "Los datos se envían en paquetes de 8 bits y tras cada byte el receptor envía un bit ACK para confirmar la recepción."}, {"type": "mc", "q": "En una escritura I2C con dirección de 7 bits, ¿qué valor tiene el bit LSB (R/W) que acompaña a la dirección?", "options": ["1, indicando lectura", "1, indicando escritura", "0, indicando escritura", "0, indicando lectura"], "answer": 2, "explanation": "En la escritura se envía START, la DIRECCIÓN y el bit LSB=0, que indica ESCRITURA."}, {"type": "tf", "q": "En la lectura de un byte en I2C, al finalizar el maestro no genera ACK y envía una condición de STOP.", "options": ["Verdadero", "Falso"], "answer": 0, "explanation": "En la lectura de 1 byte, tras recibir el dato el maestro NO genera ACK y envía una condición de STOP."}, {"type": "mc", "q": "¿Cómo inicia la trama una escritura I2C con dirección de 10 bits?", "options": ["START seguido de los 10 bits de dirección directamente", "START seguido de 11110-XX (XX = 2 bits MSB de la dirección) y el bit R/W=0", "START seguido del dato y luego la dirección", "START seguido de 0000-XX y el bit R/W=1"], "answer": 1, "explanation": "Para 10 bits se envía START, luego 11110-XX con los 2 bits MSB de la dirección y R/W=0, y después los 8 bits restantes de la dirección."}]}, {"id": "14", "title": "Protocolo SPI", "summary": ["SPI fue desarrollado por Motorola a principios de los 80 (familia 68000).", "Protocolo serial, síncrono, full duplex, con arquitectura maestro-esclavo.", "Pines SCLK, MOSI, MISO y SS/CS (activo en bajo); el reloj lo genera el maestro.", "Conexión paralela (CS por esclavo) o en cadena Daisy Chain (una sola CS).", "Modos 0-3 definidos por CPOL (reloj en reposo) y CPHA (flanco de captura).", "Alta velocidad y simplicidad, pero sin ACK, sin direccionamiento y de corta distancia."], "questions": [{"type": "mc", "q": "¿Qué empresa desarrolló el protocolo SPI y en qué familia de microcontroladores apareció por primera vez?", "options": ["Philips, familia 8051", "Intel, familia x86", "Motorola, familia 68000", "NXP, familia ARM"], "answer": 2, "explanation": "Motorola desarrolló SPI a principios de los 80 y su primera aparición fue en la familia 68000."}, {"type": "mc", "q": "¿Cuál de las siguientes es una característica general de SPI?", "options": ["Comunicación asíncrona half duplex", "Comunicación síncrona full duplex", "Comunicación paralela con arbitraje por tokens", "Comunicación síncrona semibidireccional con ACK"], "answer": 1, "explanation": "SPI es un protocolo serial, síncrono (reloj común) y full duplex, con arquitectura maestro-esclavo."}, {"type": "mc", "q": "¿Qué línea de SPI transporta los datos desde el esclavo hacia el maestro?", "options": ["MOSI", "SCLK", "SS/CS", "MISO"], "answer": 3, "explanation": "MISO (Master In Slave Out) es el canal por el que los datos fluyen del esclavo al maestro."}, {"type": "tf", "q": "En SPI, la línea SS/CS normalmente es activa en nivel bajo (lógica negativa).", "options": ["Verdadero", "Falso"], "answer": 0, "explanation": "SS/CS activa selectivamente cada esclavo y normalmente está activa en nivel bajo, deshabilitando la comunicación en estado alto."}, {"type": "mc", "q": "¿Qué debe hacer un esclavo SPI cuando no está seleccionado (CS en alto)?", "options": ["Ignorar SCLK y MOSI y mantener MISO en alta impedancia", "Generar la señal de reloj para el siguiente esclavo", "Enviar un ACK al maestro", "Mantener MISO en nivel bajo permanentemente"], "answer": 0, "explanation": "Un esclavo no seleccionado debe ignorar SCLK y MOSI y mantener su pin MISO en alta impedancia."}, {"type": "mc", "q": "En la conexión en cadena (Daisy Chain) de SPI, ¿cómo se interconectan los esclavos?", "options": ["Cada esclavo tiene su propia línea CS y comparten MISO", "La salida MISO de un esclavo se conecta a la entrada MOSI del siguiente", "Todos los esclavos comparten SDA y SCL con pull-up", "Cada esclavo genera su propio reloj SCLK"], "answer": 1, "explanation": "En Daisy Chain la salida MISO de un esclavo se conecta a la entrada MOSI del siguiente, usando una única línea CS."}, {"type": "mc", "q": "¿Cuál es una desventaja de la conexión en cadena (Daisy Chain) frente a la conexión paralela en SPI?", "options": ["Requiere más pines en el maestro", "Necesita una línea CS por cada esclavo", "Mayor latencia en la comunicación y requiere esclavos compatibles", "No permite comunicación full duplex"], "answer": 2, "explanation": "La Daisy Chain ahorra pines pero tiene mayor latencia y requiere esclavos compatibles con esa topología."}, {"type": "tf", "q": "En la conexión paralela de SPI, todos los esclavos comparten una única línea CS.", "options": ["Verdadero", "Falso"], "answer": 1, "explanation": "En la conexión paralela cada esclavo tiene su propia línea CS dedicada; la línea CS única corresponde a la Daisy Chain."}, {"type": "mc", "q": "¿Cómo inicia el maestro una comunicación SPI con un esclavo?", "options": ["Enviando la dirección del esclavo por MOSI", "Poniendo en nivel bajo la línea CS/SS del esclavo", "Generando una condición de START en SDA", "Esperando un ACK del esclavo"], "answer": 1, "explanation": "El maestro inicia la comunicación poniendo en nivel bajo (0) la línea CS/SS del esclavo deseado."}, {"type": "mc", "q": "¿Qué parámetros definen los modos de operación SPI?", "options": ["CPOL y CPHA", "ACK y NACK", "R/W y LSB", "NRZI y PAM-3"], "answer": 0, "explanation": "Los modos SPI se determinan por CPOL (polaridad del reloj) y CPHA (fase del reloj)."}, {"type": "mc", "q": "En el modo SPI 2 (CPOL=1, CPHA=0), ¿cuál es el estado del reloj en reposo y en qué flanco se capturan los datos?", "options": ["Bajo, flanco ascendente", "Bajo, flanco descendente", "Alto, flanco ascendente", "Alto, flanco descendente"], "answer": 3, "explanation": "Según la tabla de modos, el modo 2 tiene reloj en reposo alto y captura en flanco descendente."}, {"type": "tf", "q": "En SPI, CPHA determina el nivel lógico del reloj cuando no hay transferencia activa.", "options": ["Verdadero", "Falso"], "answer": 1, "explanation": "Es CPOL el que determina el nivel del reloj en reposo; CPHA define en qué flanco se capturan los datos."}, {"type": "mc", "q": "¿Cuál de las siguientes es una limitación de SPI señalada en las diapositivas?", "options": ["Solo admite 2 pines fijos", "No ofrece protocolo de ACK ni direccionamiento estándar", "Tiene velocidad máxima de 100 Kbps", "Requiere un único maestro con arbitraje por testigos"], "answer": 1, "explanation": "SPI no tiene confirmación de recepción (ACK), carece de direccionamiento estándar, tiene escalabilidad limitada y distancia restringida."}, {"type": "mc", "q": "Según la comparación de protocolos, ¿qué afirmación sobre SPI frente a I2C es correcta?", "options": ["I2C es full duplex y SPI half duplex", "SPI soporta multimaestro e I2C no", "SPI es full duplex sin detección de errores integrada; I2C es half duplex con ACK/NACK", "Ambos requieren exactamente 2 pines fijos"], "answer": 2, "explanation": "La tabla indica SPI: full duplex, sin detección de errores integrada; I2C: half duplex, con ACK/NACK y multimaestro."}, {"type": "tf", "q": "En la estructura del marco SPI, por cada bit que el maestro envía recibe otro del esclavo.", "options": ["Verdadero", "Falso"], "answer": 0, "explanation": "Cada transferencia SPI implica un intercambio completo: por cada bit enviado por MOSI se recibe otro por MISO (full duplex)."}]}, {"id": "15", "title": "Protocolo USB", "summary": ["USB surge en 1994 (consorcio USB-IF) para resolver el caos de conectores de los 90.", "Bus serie asíncrono con codificación NRZI, topología en estrella y arbitraje por tokens.", "Versiones: 1.5/12 Mbps (1.x), 480 Mbps (2.0), 5 Gbps (3.0), 10 Gbps (3.1), 40 Gbps (USB4).", "Hasta 127 dispositivos en máximo 7 niveles; un solo host por bus.", "USB-C es el conector físico; USB 3.1 define velocidad y protocolo.", "Transferencias Control, Bulk, Interrupt e Isochronous, sobre tuberías (pipes) hacia endpoints."], "questions": [{"type": "mc", "q": "¿Quién es reconocido como el \"Padre del USB\"?", "options": ["Steve Jobs de Apple", "Ajay Bhatt de Intel", "Un ingeniero de Philips", "Un ingeniero de Motorola"], "answer": 1, "explanation": "En 1995 Ajay Bhatt de Intel lideró el desarrollo técnico y es reconocido como el \"Padre del USB\"."}, {"type": "mc", "q": "¿Qué problema buscaba resolver USB a mediados de los años 90?", "options": ["La baja velocidad de los buses internos entre circuitos integrados", "La falta de memoria en los PC", "El caos de conectividad por múltiples conectores especializados (serie, paralelo, PS/2, SCSI, GamePort)", "La ausencia de redes inalámbricas"], "answer": 2, "explanation": "Cada periférico requería su propio conector (serie, paralelo, PS/2, SCSI, GamePort), lo que generaba una conectividad compleja y costosa."}, {"type": "tf", "q": "El Apple iMac G3 (1998) aceleró la adopción de USB al eliminar puertos tradicionales como el serie y el paralelo.", "options": ["Verdadero", "Falso"], "answer": 0, "explanation": "Apple eliminó el disquete y los puertos serie y paralelo en el iMac G3, apostando exclusivamente por USB."}, {"type": "mc", "q": "Según las diapositivas, ¿qué tipo de bus y codificación utiliza USB?", "options": ["Serie síncrono con codificación Manchester", "Paralelo asíncrono sin codificación", "Serie síncrono con reloj compartido SCL", "Serie asíncrono con codificación NRZI"], "answer": 3, "explanation": "USB es un bus serie asíncrono que utiliza la codificación NRZI (Non Return to Zero Inverted)."}, {"type": "mc", "q": "¿Qué topología y mecanismo de arbitraje utiliza USB?", "options": ["Estrella, con arbitraje basado en testigos (tokens)", "Multipunto multimaestro, donde el más rápido se apodera del canal", "Cadena (Daisy Chain) con una sola línea CS", "Anillo con detección de colisiones"], "answer": 0, "explanation": "USB usa topología en estrella (host, hubs y dispositivos) con un protocolo de arbitraje basado en testigos (tokens)."}, {"type": "mc", "q": "¿Cuál es el número máximo de dispositivos (devices y hubs) en un bus USB y en cuántos niveles?", "options": ["255 elementos en 5 niveles", "127 elementos en máximo 7 niveles", "400 elementos en 3 niveles", "32 elementos en 7 niveles"], "answer": 1, "explanation": "El máximo es de 127 elementos (devices y hubs) en máximo 7 niveles, coherente con la dirección única de 7 bits."}, {"type": "mc", "q": "¿Qué velocidad corresponde al modo Hi-Speed introducido en USB 2.0?", "options": ["12 Mbps", "5 Gbps", "480 Mbps", "1.5 Mbps"], "answer": 2, "explanation": "USB 2.0 (abril de 2000) introdujo Hi-Speed con 480 Mbps, cuarenta veces más rápido que USB 1.1."}, {"type": "mc", "q": "¿Cuáles son las líneas de comunicación de USB 1.1 y 2.0?", "options": ["SCL, SDA y GND", "SCLK, MOSI, MISO y CS", "Vcc (+5V), Data-, Data+ y GND", "Tx, Rx y GND"], "answer": 2, "explanation": "En USB 1.1/2.0 las líneas son Vcc (+5V, pin 1), Data- (pin 2), Data+ (pin 3) y GND, con un par diferencial de datos."}, {"type": "tf", "q": "El conector USB 3.0 tiene 9 líneas: 4 para compatibilidad, un par para transmisión SuperSpeed, un par para recepción SuperSpeed y una tierra adicional.", "options": ["Verdadero", "Falso"], "answer": 0, "explanation": "Las diapositivas indican que USB 3.0 tiene 9 líneas con esa distribución."}, {"type": "tf", "q": "Todo puerto USB-C implica necesariamente el protocolo USB 3.1.", "options": ["Verdadero", "Falso"], "answer": 1, "explanation": "USB-C define el tipo físico del conector y USB 3.1 la velocidad y el protocolo; algunos puertos USB-C usan solo USB 2.0."}, {"type": "mc", "q": "¿Cuál es la velocidad máxima y la potencia máxima (USB PD 3.1) que alcanza USB4?", "options": ["10 Gbps y 100 W", "40 Gbps y 240 W", "5 Gbps y 900 mA", "480 Mbps y 500 mA"], "answer": 1, "explanation": "USB4 alcanza hasta 40 Gbps y, con USB Power Delivery 3.1, hasta 240 W (48 V x 5 A)."}, {"type": "mc", "q": "En la arquitectura USB, ¿qué función cumple el host?", "options": ["Multiplica puertos y puede ser pasivo o activo", "Es cualquier periférico conectado (function)", "Gestiona toda la comunicación, asigna direcciones, controla el flujo de datos y proporciona energía", "Solo suministra energía a los dispositivos"], "answer": 2, "explanation": "El host reside típicamente en el chipset, gestiona la comunicación, asigna direcciones y proporciona energía; solo hay un host por bus."}, {"type": "mc", "q": "Durante la enumeración USB, ¿qué hace el host después del reset del dispositivo?", "options": ["Carga directamente el driver sin consultar al dispositivo", "Le asigna una dirección única de 7 bits (1-127)", "Envía una condición de START en Data+", "Activa la línea CS del dispositivo"], "answer": 1, "explanation": "Tras la detección y el reset (al menos 10 ms), el host asigna una dirección única de 7 bits y luego solicita los descriptores."}, {"type": "mc", "q": "¿Qué tipo de transferencia USB es adecuado para streaming de audio o videoconferencia?", "options": ["Isochronous", "Bulk", "Control", "Interrupt"], "answer": 0, "explanation": "La transferencia isócrona es para datos en tiempo real sensibles a la latencia; no garantiza entrega ni usa handshaking."}, {"type": "mc", "q": "¿Qué tipo de transferencia USB usan típicamente teclados y ratones (dispositivos HID)?", "options": ["Bulk", "Isochronous", "Control", "Interrupt"], "answer": 3, "explanation": "La transferencia Interrupt se usa para datos pequeños y periódicos con polling del host, como teclados, ratones y joysticks."}]}]};
const $ = s => document.querySelector(s);
const topics = DATA.topics;
const total = topics.reduce((n,t)=>n+t.questions.length,0);
$('#stats').textContent = `${topics.length} temas · ${total} preguntas`;

// theme
const root = document.documentElement;
try{ const t = localStorage.getItem('theme'); if(t) root.dataset.theme = t; }catch(e){}
$('#theme').onclick = () => {
  const dark = root.dataset.theme ? root.dataset.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  try{ localStorage.setItem('theme', root.dataset.theme); }catch(e){}
};

// topic list
$('#topicList').innerHTML = topics.map((t,i)=>
  `<label><input type="checkbox" value="${i}" checked><span><b>${t.id}</b> ${esc(t.title)} <span class="muted">(${t.questions.length})</span></span></label>`).join('');
$('#all').onclick = () => document.querySelectorAll('#topicList input').forEach(c=>c.checked=true);
$('#none').onclick = () => document.querySelectorAll('#topicList input').forEach(c=>c.checked=false);

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

// tabs
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('[data-tab]').forEach(x=>x.setAttribute('aria-pressed', x===b));
  const exam = b.dataset.tab==='exam';
  $('#study').classList.toggle('hide', exam);
  ['#setup','#quiz','#result'].forEach(s=>$(s).classList.add('hide'));
  if(exam) $('#setup').classList.remove('hide'); else renderStudy();
});

function renderStudy(){
  $('#study').innerHTML = topics.map(t=>`<div class="card"><details><summary>${t.id} · ${esc(t.title)}</summary>
    <ul class="sum">${t.summary.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></details></div>`).join('');
}

let S = null;
$('#start').onclick = () => {
  const sel = [...document.querySelectorAll('#topicList input:checked')].map(c=>+c.value);
  if(!sel.length){ alert('Selecciona al menos un tema.'); return; }
  let pool = [];
  sel.forEach(i=>topics[i].questions.forEach(q=>pool.push({...q, topic:topics[i]})));
  shuffle(pool);
  const n = +$('#count').value; if(n) pool = pool.slice(0,n);
  pool = pool.map(q=>{
    const order = q.type==='tf' ? [0,1] : shuffle(q.options.map((_,i)=>i));
    return {...q, order, picked:null};
  });
  S = {qs:pool, i:0, mode:$('#mode').value};
  $('#setup').classList.add('hide'); $('#result').classList.add('hide');
  $('#quiz').classList.remove('hide');
  renderQ();
};

function renderQ(){
  const q = S.qs[S.i], done = q.picked!==null, reveal = done && S.mode==='now';
  const opts = q.order.map(oi=>{
    let cls = '';
    if(reveal){ if(oi===q.answer) cls='ok'; else if(oi===q.picked) cls='bad'; }
    else if(done && oi===q.picked) cls='ok';
    return `<button class="opt ${cls}" data-o="${oi}" ${reveal?'disabled':''}>${esc(q.options[oi])}</button>`;
  }).join('');
  const answered = S.qs.filter(x=>x.picked!==null).length;
  $('#quiz').innerHTML = `<div class="card">
    <div class="row" style="justify-content:space-between"><span class="tag">${q.topic.id} · ${esc(q.topic.title)}</span><span class="muted">${S.i+1} / ${S.qs.length}</span></div>
    <div class="bar"><i style="width:${answered/S.qs.length*100}%"></i></div>
    <p class="q">${esc(q.q)}</p>${opts}
    ${reveal?`<div class="expl"><b>${q.picked===q.answer?'Correcto.':'Incorrecto.'}</b> ${esc(q.explanation)}</div>`:''}
    <div class="row" style="justify-content:space-between;margin-top:14px">
      <button id="prev" ${S.i?'':'disabled'}>Anterior</button>
      ${S.i<S.qs.length-1?`<button class="primary" id="next">Siguiente</button>`:`<button class="primary" id="finish">Terminar</button>`}
    </div></div>`;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ q.picked=+b.dataset.o; renderQ(); });
  $('#prev').onclick=()=>{S.i--;renderQ()};
  if($('#next')) $('#next').onclick=()=>{S.i++;renderQ()};
  if($('#finish')) $('#finish').onclick=finish;
}

function finish(){
  const pend = S.qs.filter(q=>q.picked===null).length;
  if(pend && !confirm(`Te faltan ${pend} preguntas sin responder. ¿Terminar igual?`)) return;
  const ok = S.qs.filter(q=>q.picked===q.answer).length;
  const by = {};
  S.qs.forEach(q=>{const k=q.topic.id; by[k]=by[k]||{t:q.topic.title,n:0,ok:0}; by[k].n++; if(q.picked===q.answer) by[k].ok++;});
  const wrong = S.qs.filter(q=>q.picked!==q.answer);
  const pct = Math.round(ok/S.qs.length*100), nota = (ok/S.qs.length*5).toFixed(1);
  $('#quiz').classList.add('hide');
  $('#result').classList.remove('hide');
  $('#result').innerHTML = `<div class="card"><h2>Resultado</h2>
    <div class="score">${ok} / ${S.qs.length} <span class="muted" style="font-size:1rem">(${pct}% · nota ${nota} / 5.0)</span></div>
    <table><tr><th>Tema</th><th>Aciertos</th></tr>${Object.entries(by).map(([k,v])=>`<tr><td>${k} · ${esc(v.t)}</td><td>${v.ok} / ${v.n}</td></tr>`).join('')}</table>
    <div class="row" style="margin-top:14px"><button class="primary" id="again">Nuevo examen</button>${wrong.length?`<button id="retry">Repetir solo las falladas (${wrong.length})</button>`:''}</div></div>
    ${wrong.map(q=>`<div class="card"><span class="tag">${q.topic.id} · ${esc(q.topic.title)}</span><p class="q">${esc(q.q)}</p>
      <p>Tu respuesta: <b style="color:var(--bad)">${q.picked===null?'(sin responder)':esc(q.options[q.picked])}</b><br>Correcta: <b style="color:var(--ok)">${esc(q.options[q.answer])}</b></p>
      <div class="expl">${esc(q.explanation)}</div></div>`).join('')}`;
  $('#again').onclick=()=>{$('#result').classList.add('hide');$('#setup').classList.remove('hide');scrollTo(0,0)};
  if($('#retry')) $('#retry').onclick=()=>{
    S = {qs:shuffle(wrong.map(q=>({...q,picked:null}))), i:0, mode:S.mode};
    $('#result').classList.add('hide'); $('#quiz').classList.remove('hide'); renderQ(); scrollTo(0,0);
  };
  scrollTo(0,0);
}
</script>
</body>
</html>
